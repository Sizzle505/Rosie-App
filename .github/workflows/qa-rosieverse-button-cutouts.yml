name: Verify transparent RosieVerse button assembly
on:
  push:
    branches: [work/rosieverse-landing-cinematic-20261009]
    paths: [.github/workflows/qa-rosieverse-button-cutouts.yml]
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Build and start app
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 > /tmp/rosie-qa.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
      - name: Render actual landing, links, transparency, layout
        run: |
          node --input-type=module <<'JS'
          import { chromium, webkit } from 'playwright';
          import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('rosieverse-qa',{recursive:true});
          const results={ref:process.env.GITHUB_SHA, tests:[], errors:[]};
          const sizes=[[390,844],[375,667],[320,650],[768,1024],[1440,900]];
          for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
            const browser=await engine.launch({headless:true});
            for(const [w,h] of sizes){
              const context=await browser.newContext({viewport:{width:w,height:h},isMobile:w<=390,hasTouch:w<=390,deviceScaleFactor:1});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'networkidle'});
              await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
              await page.locator('nav[aria-label="RosieVerse destinations"] button').first().waitFor();
              const assets=await page.evaluate(async ()=>{
                const ims=[...document.querySelectorAll('nav[aria-label="RosieVerse destinations"] button img')];
                const output=[];
                for (const i of ims){
                  await i.decode();
                  const cv=document.createElement('canvas');cv.width=1;cv.height=1;
                  cv.getContext('2d').drawImage(i,0,0,1,1,0,0,1,1);
                  const alpha=cv.getContext('2d').getImageData(0,0,1,1).data[3];
                  output.push({src:i.getAttribute('src'),natural:[i.naturalWidth,i.naturalHeight],transparentTopLeft:alpha<32});
                }
                return {width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,buttons:ims.length,images:output};
              });
              if(assets.buttons!==5)results.errors.push(`${name} ${w}x${h}: ${assets.buttons} buttons`);
              if(assets.width>w+1)results.errors.push(`${name} ${w}x${h}: horizontal overflow ${assets.width}`);
              if(assets.images.some(x=>!x.transparentTopLeft))results.errors.push(`${name} ${w}x${h}: a dark image corner has not been removed`);
              if(pageErrors.length)results.errors.push(`${name} ${w}x${h}: runtime errors: ${pageErrors.join(';')}`);
              await page.screenshot({path:`rosieverse-qa/${name}-${w}x${h}.png`,fullPage:true,animations:'disabled'});
              if(w===390){
                const expected=[['fortune','Fortune Teller'],['cheese','Cheese Board Exam'],['captain','Captain Rosie'],['vault','Card Vault'],['randomizers','Randomizers']];
                for(const [id,label] of expected){
                  await page.getByRole('button',{name:'Open '+label}).click();
                  if(!page.url().endsWith('#'+id))results.errors.push(`${name} navigation ${label} failed`);
                  await page.goto('http://127.0.0.1:4173/#home');
                  await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
                }
              }
              results.tests.push({engine:name,viewport:[w,h],...assets});
              await context.close();
            }
            await browser.close();
          }
          writeFileSync('rosieverse-qa/report.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify({count:results.tests.length,errors:results.errors},null,2));
          if(results.errors.length)process.exitCode=1;
          JS
      - name: Save actual browser screenshots and metrics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosieverse-qa || true
          git diff --cached --quiet || git commit -m "Store RosieVerse transparent-button browser QA capture [skip ci]"
          git push origin HEAD:refs/heads/work/rosieverse-landing-cinematic-20261009
