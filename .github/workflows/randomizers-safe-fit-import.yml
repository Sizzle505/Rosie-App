name: Import full-frame approved Randomizers header
on:
  push:
    branches:
      - work/randomizers-hero-safe-fit-20261013
    paths:
      - .github/workflows/randomizers-safe-fit-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download newest approved Randomizers header from Dropbox
        env:
          APPROVED_IMAGE_URL: "https://ucd934bcf4f766a3401591bf820f.dl.dropboxusercontent.com/cd/0/get/DJ5Hx-0kPSatK3V3SvAvQfMo9JE5lfG1E3tgsx1BBZ3g7QdmpzeXdL6npD-taI-eNYsHaRUJXsdY-XhAtkMAmfBVitwbMubVq279EzwnbrpVuX1PSwa9krcTi4cYK3nURfjn4dQEY8R1hTYTZwmpklY515RjSLQOvoFGn8p5W8_NhA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 120 "$APPROVED_IMAGE_URL" -o /tmp/rosie-randomizers-new.png
          test "$(wc -c < /tmp/rosie-randomizers-new.png)" -gt 1000000
      - name: Optimize complete image without clipping any edges
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          image=Image.open("/tmp/rosie-randomizers-new.png").convert("RGB")
          assert image.size == (1448,1086),f"Unexpected artwork dimensions: {image.size}"
          dest=Path("public/randomizers/rosie-randomizers-casino-header-safe-fit.webp")
          dest.parent.mkdir(parents=True,exist_ok=True)
          image.save(dest,"WEBP",quality=91,method=6)
          assert dest.stat().st_size>80000,"Compressed image unexpectedly small"
          print("Full-frame",image.size,"saved",dest.stat().st_size,"bytes")
          PY
      - name: Commit approved image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/randomizers/rosie-randomizers-casino-header-safe-fit.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(randomizers): transfer full-frame approved casino illustration"
            git fetch origin work/randomizers-hero-safe-fit-20261013
            git rebase origin/work/randomizers-hero-safe-fit-20261013
            git push origin HEAD:work/randomizers-hero-safe-fit-20261013
          fi
