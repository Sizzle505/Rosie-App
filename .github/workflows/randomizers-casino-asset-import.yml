name: Import approved Randomizers casino header
on:
  push:
    branches:
      - work/randomizers-approved-casino-header-20261012
    paths:
      - .github/workflows/randomizers-casino-asset-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original approved composition via Dropbox
        env:
          APPROVED_IMAGE_URL: "https://uc518c646a3c3492a9fda9d1e776.dl.dropboxusercontent.com/cd/0/get/DJ6QrcLHQBJ0G6jaaH7bGxjZgrI-unVvFgrhP1kcjOzltCpM3liL8y96XoON0aSAHR5YqZcaoo1i2Ja5F_f-qqn5i6J0DXqBPDq64nu-20iqsvH0hba1qnUmY3i5E9sET1uUczMMN_-x1cW1mDR18FcYuKBAFIQCiZSNpYTVPNV-Tg/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 120 "$APPROVED_IMAGE_URL" -o /tmp/rosie-randomizers-approved.png
          test "$(wc -c < /tmp/rosie-randomizers-approved.png)" -gt 1000000
      - name: Prepare iPhone-ready casino header
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          original = Image.open("/tmp/rosie-randomizers-approved.png").convert("RGB")
          if original.size != (1448, 1086):
              raise RuntimeError(f"Unexpected original dimensions: {original.size}")
          # Remove the unused dark exterior of the illustration, not its gold frame.
          framed = original.crop((18, 72, 1393, 979))
          dest = Path("public/randomizers/rosie-randomizers-casino-header.webp")
          dest.parent.mkdir(parents=True, exist_ok=True)
          framed.save(dest, "WEBP", quality=90, method=6)
          print(f"Approved casino header: {framed.size}, {dest.stat().st_size} bytes")
          if dest.stat().st_size < 60000:
              raise RuntimeError("Suspiciously small image asset")
          PY
      - name: Commit optimized approved asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/randomizers/rosie-randomizers-casino-header.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(randomizers): import approved casino header from Dropbox"
            git fetch origin work/randomizers-approved-casino-header-20261012
            git rebase origin/work/randomizers-approved-casino-header-20261012
            git push origin HEAD:work/randomizers-approved-casino-header-20261012
          fi
