name: Haiku Garden visual layout QA
on:
  pull_request:
    paths:
      - src/RosieHaikuGarden.css
      - src/RosieHaikuGarden.jsx
      - src/RosieHaikuScene.css
      - src/RosieHaikuScene.jsx
      - src/styles.css
      - tests/haiku-layout-visual.mjs
      - .github/workflows/haiku-layout-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/haiku-visual-vite.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/haiku-visual-vite.log
          exit 1
      - name: Confirm page geometry, scene switching and responsive layout
        run: node tests/haiku-layout-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haiku-garden-desktop-ipad-iphone-screenshots
          path: artifacts/haiku-layout/
          retention-days: 14
