name: Import original Timekeeper gear artwork (one-time)
on:
  push:
    paths:
      - '.github/workflows/rosie-timekeeper-gears-import-once.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/work/rosie-resources-integrated-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import atlas and retire one-time workflow
        env:
          TRANSFER_URL: 'https://uc0146c65e92b990fc84071c95f7.dl.dropboxusercontent.com/cd/0/get/DJ2UEJcGsvUfb-RxU_eMbZcI-_L0gIfdKTnf359b5AYKHvv5VWMKT10_ZUmwIPmTT12gidogfl5rK_2EoeOVcrgEt0DkrU-Zpl-QY8GCN9EnJur2r8CDIrJMlEDqRgqbt5-xIuqp3TMICjClUbKcuVu47ZNhCPf2uLQm_GxZ1J-frw/file?c_luid=667ded1d'
        run: |
          set -euo pipefail
          mkdir -p public/rosieverse/timekeeper
          curl --fail --location --silent --show-error --retry 2 "$TRANSFER_URL" --output public/rosieverse/timekeeper/gear-atlas.png
          echo '8d54df4b65762365909eb89e59671e457cff0aa51247973d241a3ecbf8a70085  public/rosieverse/timekeeper/gear-atlas.png' | sha256sum --check
          file public/rosieverse/timekeeper/gear-atlas.png
          git rm -- .github/workflows/rosie-timekeeper-gears-import-once.yml
          git add public/rosieverse/timekeeper/gear-atlas.png
          git -c user.name='Rosie Gear Importer' -c user.email='actions@users.noreply.github.com' commit -m 'Import approved gold and ruby Timekeeper gears'
          git push origin "HEAD:${GITHUB_REF_NAME}"
