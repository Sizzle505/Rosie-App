name: Import approved Cosmic Odyssey cards once
on:
  push:
    branches: ['feature/cosmic-fiend-cards-20261118']
    paths: ['.github/workflows/cosmic-card-import-once.yml']
permissions:
  contents: write
jobs:
  import-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the six explicitly approved source images
        env:
          JETT_FRONT_URL: 'https://uc3f9eed847f6a86dd503ce2b53a.dl.dropboxusercontent.com/cd/0/get/DMNzFU2HaBdD7DnD-FEGbqVXXtWjxBRrnAW1lBlqbATitGV1aTliTXJtGmCWbQdXzNd2W4n2BCcqIr-00DmxdbTOzVtw-Y5QVKGGutqN-LLQrJeNI_-t8d_1wg3FQIsbjYtIitrPv0C3TmzZI40ufps2qPnHAA327MP3HwIdU1CkNA/file?c_luid=667ded1d'
          JETT_BACK_URL: 'https://uca85174b310b79db4621b390d07.dl.dropboxusercontent.com/cd/0/get/DMMSl1vO4e8m4emmQZ_-qdOYY58SV7NfCca35KJWzY8BXasVdnBPVLclJxqn3Lp26QVVsZkwmaafQ_aimPX5DkY36Pkrm5bAvbZvJ3brlmM85eIB9W_JdHTGDXuVJ0Dvx0MemxQsAgZKJGAJWK25Bn0vACXNdGxlJqrf9j8r7Iy_wQ/file?c_luid=667ded1d'
          KITTY_FRONT_URL: 'https://ucfde9a911c441316892564dc324.dl.dropboxusercontent.com/cd/0/get/DMNCksTn3M_scVnbk0fLCvEX3i0a9Tdyrmj_HDAeCnGicV-aUOIcavTjTeVbOcsEvLSyZauO2Q16Ot6BMNgamGytLYcMrScFgLfFys9JZ8iatSBLsIES_9v2KjNeVNh05vodcETmNP4dWYdL1x2Plw4UIcHuZ5l-lSCytTtXiH6lpQ/file?c_luid=667ded1d'
          KITTY_BACK_URL: 'https://uc8049d7461497855e9f5c03ca45.dl.dropboxusercontent.com/cd/0/get/DMOYYdiYjwUXim_6IC6ZPfYMYgIyhm8ezhTW-NW9FeB-me0pmBWcdpd7fNu2vwlWTuIQojRIc-SADkMSyzZhHSWdcXlR3plqkT-5XRTmteJiCphPPuIFRkKbMv9gh4pLyCfoCl8r9TE4YEFq4dOYR9wsZYT3dqG_7Kq4bdxTXENNHg/file?c_luid=667ded1d'
          CHIP_FRONT_URL: 'https://uc0b732faae2416a06676b9c8229.dl.dropboxusercontent.com/cd/0/get/DMNBEMjVExDN3nYulh-t9ALYsX3VfCXFx1aGBYy27_8Qo7iJXlQqowhFLokvq15RP-5IIvyCcFpUdBBz6KJ3laHKkHS40DxF2x5K5yQUD54iGxXBx3oWMaeb8Zhm1BFAi6QZzWyEiBel25_XNGL0_cDp-SvFc8d-ui8C4OiNtBe7pQ/file?c_luid=667ded1d'
          CHIP_BACK_URL: 'https://ucb1c0c9b1225662c6de9b421011.dl.dropboxusercontent.com/cd/0/get/DMMwHf08p4_qiZRF7lXr-7g7Sbhoy6_RV-A2rXWUiR7slg05FsLpmpqJypq7Za0Nr8Ae6lLgsMZPIykB2g2YAaayAxAZyhE8ceXcxpys4tWEdbnJ8RNdv25LNaJeOKD5sLtUL6IptTk3-Bz5T0jgv0HrtkLvffSrQAnZ2EbYBppgUg/file?c_luid=667ded1d'
        run: |
          set -eu
          curl -fLsS --max-time 120 --retry 0 "$JETT_FRONT_URL" -o "/tmp/jett-front.png"
          curl -fLsS --max-time 120 --retry 0 "$JETT_BACK_URL" -o "/tmp/jett-back.png"
          curl -fLsS --max-time 120 --retry 0 "$KITTY_FRONT_URL" -o "/tmp/kitty-front.png"
          curl -fLsS --max-time 120 --retry 0 "$KITTY_BACK_URL" -o "/tmp/kitty-back.png"
          curl -fLsS --max-time 120 --retry 0 "$CHIP_FRONT_URL" -o "/tmp/chip-front.png"
          curl -fLsS --max-time 120 --retry 0 "$CHIP_BACK_URL" -o "/tmp/chip-back.png"
      - name: Optimize losslessly sized collectible cards to WebP
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          output=Path('public/cosmic-odyssey/cards')
          output.mkdir(parents=True,exist_ok=True)
          for filename in ["jett-front","jett-back","kitty-front","kitty-back","chip-front","chip-back"]:
              source=Path('/tmp')/(filename+'.png')
              with Image.open(source) as im:
                  im.load()
                  assert im.size==(1024,1536),(filename,im.size)
                  im.convert('RGB').save(output/(filename+'.webp'),'WEBP',quality=90,method=6)
                  print(filename,(output/(filename+'.webp')).stat().st_size)
          PY
      - name: Commit the six verified image files
        run: |
          set -eu
          git config user.name "Rosie App Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git add public/cosmic-odyssey/cards/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Import approved Fiend card fronts and backs"
          git push origin HEAD:feature/cosmic-fiend-cards-20261118
