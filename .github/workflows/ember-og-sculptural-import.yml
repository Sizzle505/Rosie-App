name: Ember original sculptural art - one-time verified import
on:
  push:
    branches:
      - work/ember-og-ribbon-prototype-20261014
    paths:
      - ".github/workflows/ember-og-sculptural-import.yml"
permissions:
  contents: write
jobs:
  install-verified-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import 16 original asset-derived PNG crops, NO substitutions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ember-drill/edge/formation
          curl --fail --silent --show-error --location --retry 3 --max-time 90             "https://sb-7kln1eg5amxf.vercel.run/formations-transfer.zip" -o /tmp/ember-original-formations.zip
          echo "feef7b96447b843552f8641d915054cee25920347e0596291e79e608112d2dec  /tmp/ember-original-formations.zip" | sha256sum -c -
          unzip -oq /tmp/ember-original-formations.zip -d public/ember-drill/edge/formation
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path("public/ember-drill/edge/formation")
          manifest=json.loads((folder/"formations.json").read_text())
          assets=manifest["assets"]
          assert len(assets)==16, len(assets)
          assert set(a["source"] for a in assets)=={
           "14 - Hanging Roots.png","20 - Cavern Ceiling Overlay.png",
           "21 - Crystal Floor Overlay.png","33 - Dynamic Tunnel Edge B.png",
           "34 - Dynamic Tunnel Edge C.png","35 - Dynamic Tunnel Edge D.png",
           "36 - Dynamic Tunnel Edge E.png"}
          for asset in assets:
           f=folder/asset["name"]
           assert f.is_file() and f.stat().st_size>10000, f
           assert len(asset["sourceSha256"])==64
          print("Verified all",len(assets),"alpha-preserving, original-source ceiling/floor/roots formations")
          PY
      - name: Permanently track original-source sprites on isolated feature branch
        run: |
          git config user.name "Ember OG Source Forge"
          git config user.email "actions@users.noreply.github.com"
          git add public/ember-drill/edge/formation/*.webp public/ember-drill/edge/formation/formations.json
          if ! git diff --cached --quiet; then
            git commit -m "Permanently integrate 16 full-depth OG-derived ceiling overhangs, roots and crystal floor pieces"
            git push origin HEAD:work/ember-og-ribbon-prototype-20261014
          fi
