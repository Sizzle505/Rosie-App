name: Audit EmberOG original art (one-time)
on:
  push:
    branches: ["work/ember-drill-barkroot-ruby-milestone"]
    paths:
      - ".github/workflows/ember-og-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow
      - name: Inspect original archive (no repository changes)
        env:
          EMBER_ORIGINALS_URL: 'https://uc1052bb51676c5f248781fae00d.dl.dropboxusercontent.com/cd/0/get/DKBJ-qFLap4c_uSfZfQdnZLU4NV3RH3sVz7XvztRcdXa0isNCBd8hVadzJwItXKkPqhM67kgKejNRuaFk2u7xmG69K0jF7fkiizN9PUxlwbOFfwjSwCgtRT7u3Fys3j57P6WG1aGiC4-Cj5V-kk3v_CRD86YNzk7JukBbomLqoT2WA/file?c_luid=667ded1d'
        shell: bash
        run: |
          python - <<'PY'
          import os,io,zipfile,urllib.request,json
          from PIL import Image,ImageOps
          req=urllib.request.Request(os.environ["EMBER_ORIGINALS_URL"],headers={"User-Agent":"Rosie-EmberOriginals-Audit"})
          with urllib.request.urlopen(req,timeout=100) as r: data=r.read()
          print("ORIGINAL_ZIP_BYTES",len(data))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            files=[f for f in z.infolist() if not f.is_dir() and not f.filename.startswith("__MACOSX/") and not f.filename.endswith(".DS_Store")]
            print("ORIGINAL_ZIP_FILECOUNT",len(files))
            for idx,f in enumerate(files,1):
              out={"index":idx,"name":f.filename,"size":f.file_size}
              if f.filename.lower().endswith((".png",".jpg",".jpeg",".webp")):
                try:
                  im=Image.open(io.BytesIO(z.read(f.filename)))
                  out["format"]=im.format;out["dims"]=[im.width,im.height]
                  out["mode"]=im.mode
                  out["alpha_minmax"]=list(im.convert("RGBA").getchannel("A").getextrema())
                  out["corners_alpha"]=[im.convert("RGBA").getchannel("A").getpixel((x,y)) for x in (0,im.width-1) for y in (0,im.height-1)]
                except Exception as e:out["image_error"]=str(e)
              print("OG_ASSET "+json.dumps(out,ensure_ascii=False))
          PY
