name: Import approved Captain Rosie collectible cards
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rosie-card-import-once.yml
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Download, integrity-check and optimize approved artwork
        env:
          ROSIE_FRONT_URL: 'https://uca153fff76aa24b800b084ced6a.dl.dropboxusercontent.com/cd/0/get/DMPoNt70_-CHbVhSBeRSH75sv-OkNXH6hWlxu7-RgkcDmP85RvYioXVl-kFiKbf-k7hIiCpw1sKeeshGXK1kwSUMNGakNYRuC5EEwArTY2w5SwmR297gc81Ah6BRBr4TjQERQpakveMr4dJdVeJ0wHf3hkF-te5LYOqKJ8g4AlZBGg/file?c_luid=667ded1d'
          ROSIE_BACK_URL: 'https://ucdc90904b9070d82e0df3fc6e34.dl.dropboxusercontent.com/cd/0/get/DMO2kfiXj1Uz4CU4WLA-Ah2uWur1G_PlkZbzjlMTPv7-95_OMKDgva_zeZpnfzhE11ANHBRd7JW_-wSFLiqB-A3fkxPYw3w7KpEuxPDen2wpTpiJiCE6aHsZAcbNqkagQYqED7cqe1ldlNEBkhi4HqWWtRrmrLhg7KD6ihOvn5ifgQ/file?c_luid=667ded1d'
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 0 --max-time 80 "$ROSIE_FRONT_URL" -o /tmp/rosie-front.png
          curl -fLsS --retry 0 --max-time 80 "$ROSIE_BACK_URL" -o /tmp/rosie-back.png
          echo '48a8165520f06d39ffa73eeada9bb183f0c7cb84c6cb0b9eed7b4cd08130e53c  /tmp/rosie-front.png' | sha256sum -c -
          echo '93280f9bb41ff314060dac6f7c30eeba56000a1a6c4bfa1a721463a9d9ea9cde  /tmp/rosie-back.png' | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          out=Path('public/cosmic-odyssey/cards')
          out.mkdir(parents=True,exist_ok=True)
          for side in ('front','back'):
              source=Image.open('/tmp/rosie-'+side+'.png').convert('RGB')
              assert source.width==1024 and source.height in (1535,1536),source.size
              if source.height==1535: source=source.resize((1024,1536),Image.Resampling.LANCZOS)
              target=out/('rosie-'+side+'.webp')
              source.save(target,'WEBP',quality=93,method=6)
              assert target.exists() and target.stat().st_size>100000
              print(side,target.stat().st_size,source.size)
          PY
      - name: Commit card assets and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rosie-card-import-once.yml
          git config user.name 'Rosie App Asset Import'
          git config user.email 'actions@users.noreply.github.com'
          git add public/cosmic-odyssey/cards/rosie-front.webp public/cosmic-odyssey/cards/rosie-back.webp .github/workflows/rosie-card-import-once.yml
          git commit -m 'Add approved Captain Rosie front and back to Cosmic Odyssey cards'
          git push origin HEAD:main
