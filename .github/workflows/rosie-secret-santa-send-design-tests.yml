name: Send two revised Rosie Secret Santa test emails
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rosie-secret-santa-send-design-tests.yml
permissions:
  contents: read
jobs:
  send-design-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live images and send isolated welcome plus draw emails to RosieVerse750
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const origin = "https://rosie-app-git.vercel.app";
          const endpoint = origin + "/api/secret-santa";
          async function call(action, payload) {
            const r = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action, ...payload }),
              signal: AbortSignal.timeout(55000)
            });
            const data = await r.json();
            assert.ok(r.ok, action + " HTTP " + r.status + ": " + (data.error || "unknown"));
            return data;
          }
          for(const template of ["preview-registration.html","preview-draw.html"]) {
            const response = await fetch(origin + "/randomizers/secret-santa/email/" + template);
            assert.equal(response.status,200,"Preview is unavailable");
            const html = await response.text();
            assert.ok(html.includes("holiday-gifts.png"),"Gift artwork not deployed");
            assert.ok(html.includes("max-width:680px"),"Enlarged header not deployed");
          }
          const created = await call("create", {
            title: "DESIGN TEST - Rosie's Secret Santa 2026",
            names: ["Rosie Email Preview", "Holiday Sample A", "Holiday Sample B"]
          });
          const exchangeId = created.exchange.id, hostToken = created.hostToken;
          const guestId = created.exchange.participants[0].id;
          console.log("TEST_EXCHANGE_ID=" + exchangeId);
          const auth = { exchangeId, hostToken };
          await call("emails", {...auth,updates:[{id:guestId,email:"RosieVerse750@gmail.com"}]});
          const welcome = await call("sendConfirmations",auth);
          console.log("WELCOME_ACCEPTED=" + welcome.mail.sent);
          console.log("WELCOME_FAILED=" + welcome.mail.failed);
          assert.equal(welcome.mail.sent,1,"Gmail did not accept the welcome email");
          assert.equal(welcome.mail.failed,0);
          const draw = await call("draw",auth);
          console.log("DRAW_ACCEPTED=" + draw.mail.sent);
          console.log("DRAW_FAILED=" + draw.mail.failed);
          assert.equal(draw.mail.sent,1,"Gmail did not accept the drawing email");
          assert.equal(draw.mail.failed,0);
          const status = await call("mailStatus",auth);
          const individual = status.mail.delivery[guestId];
          assert.equal(individual.registration.status,"sent");
          assert.equal(individual.draw.status,"sent");
          console.log("PASS: Exactly two revised emails accepted by Gmail for RosieVerse750@gmail.com.");
          console.log("The test exchange is isolated from the 2026 guest exchange.");
          JS
