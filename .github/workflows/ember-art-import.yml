name: Import Ember Drill illustrated assets (one-time)
on:
  push:
    branches: ["work/ember-drill-barkroot-ruby-milestone"]
    paths: [".github/workflows/ember-art-import.yml"]
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: "work/ember-drill-barkroot-ruby-milestone"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Install Dropbox artwork with alpha registration and optimize for web
        shell: bash
        run: |
          python - <<'PY'
            import io, zipfile, urllib.request
            from pathlib import Path
            from PIL import Image, ImageOps
            FILES = [["pack","https://uc1587a8d3dc5e45e49cff168a54.dl.dropboxusercontent.com/cd/0/get/DJ9fTLhL4zWBlQmzzlPq5uGyJzxh5CwQ_3ATnfmgcQUuevgejz2C0KZ15A2JGij1fckdxNTCnU1mzPxL1G25QVkYehgq4oxw4esAA_eia0wBxrvGUDp1WicYmCZ7RHVfdeUNSNPZVBwrEIOA1M8cGSxroNiPJMjBw8_TnyUIpijRkw/file?c_luid=667ded1d"],["header","https://uc81b794f395b2adbc05bd6a7ddf.dl.dropboxusercontent.com/cd/0/get/DJ9yGyIxoyT_gdNDIBBCxJO5Zy94wXMwc5aMh9wJBqb2j1CxCZZDQGgDJTMXMoXL0OBoOvdKQhvkHBHlpMMUaxriw9BiOMokGdZjc63WgaqleEiliWHRejsDEbBi_mf9_s-n7XItGtTsAl1nLcHljA0I1eo7tfNdXe4xkGmzSpzFkA/file?c_luid=667ded1d"],["scenic-barkroot","https://ucd1e5a85da48d433864722c2bfe.dl.dropboxusercontent.com/cd/0/get/DJ_a2qOOGXux6H_5pQJ7ZA7YfdMPSGGvH8da4xnw7acqX8eFuIlHOeiPF7Jo97G-08pClotUFeRmTfvOuk9bhJLKLBj_v0VuUaNq-KoP1QeYLXeeMuUR_8qlOHcVfaiGt-U4yomjkLQyyAoK9T4TZRFQcbpq_-Yih7k48Wp0BjQ1pg/file?c_luid=667ded1d"],["scenic-lantern","https://ucf25bdfc0c1467353006fd02c18.dl.dropboxusercontent.com/cd/0/get/DJ-FnfVXUlcKtKj-rXmvBiJ2mp6mc_vn1Xi8ksAAIsVmOQhBF-H1Dtj3EQCjAQPesQw12yulhxlGlS9r0cq85C0rLFyFWBE6EDIiE7xDqFCeLYcZql83tIrvgdO-ErWmGGz4dOH_8V-rAeI8WjghGCymDHDGrSA4FIJxBbf3YSZ1jA/file?c_luid=667ded1d"],["scenic-roots","https://uc53f44007fff543b129bdfbf41c.dl.dropboxusercontent.com/cd/0/get/DJ8lOVdAxCNhm33Sl-08Ws82Sb-qJTGahnUtul6JNvO2IUDALey2yJrIUG75w8MTqxVl7yNcuPAwPrnlhQr1xXruJinwyT-FYd62laqjLkSYcILuq4hh8TdUlkxwMDYeboN6Q2e3qCiXIO9vKotubwT6fxDBkyoPGmpQsPWE5ledjA/file?c_luid=667ded1d"],["scenic-crystal","https://uccd826fe73c560468ef3c7bc88c.dl.dropboxusercontent.com/cd/0/get/DJ8A8jLcvz3I39lS-PtaSmP0le8uKkUUvuUoa7Y66G2SdQrB-_rMBXnneXElZBQoWigfyThUh_fEhOCFpfebQRT3GvPQj8M7XpE0yNhdLg0tkRLv4TqHz73FiGVOVrHNvX89YXpj_A_i79Lk2Ov26UjZQbfNBlbFqllLhHn7IV3YLw/file?c_luid=667ded1d"],["scenic-temple","https://uc14d6cfed511db7f7fe39b91bbe.dl.dropboxusercontent.com/cd/0/get/DJ8MOF5bvY4Z-Me1oTw8VTByaX3l2uhxJK07Yjt9WKDCNHXJTY43T_8oUQ4c1r3Yz7nTc44nsvnxmrbKlVuaFyDcpZxg1mjE1Vnbbvb9Au8XJv9xTcCfMsBG6MqXUxGik1urTdPjjTipGFzqY7d0tYWHoiw0THB_qv8p5H32NmayVQ/file?c_luid=667ded1d"],["collect-bone","https://uc12b2f5f3a8a0e54fabf46ac7ed.dl.dropboxusercontent.com/cd/0/get/DJ__De6aUvAHDlyyI5SGtU-uI-FbnEmL34JDLIyOoGHTbMZhjyGKmIgrvJAPKAp1iDA1cbde7Q3cOrilJKkYC_OSbY7g3XCRXpj5snEI_9-6KDJkvdVJp3-RTngsawIWBlsyKpTBB27CFQmTrq00BqWjgws-OVw6ONpxrA3eNiA5fg/file?c_luid=667ded1d"],["collect-cheese","https://ucfa8de521623b4f4a5e88f3511f.dl.dropboxusercontent.com/cd/0/get/DJ9O_UYVLFwWinfT8VECuK4YhrCtBEcYU3jNV8knQToF8pokt4PV4r1WP62MpIFa39muNGWnBcsv_nAnDMvhUpN4S5s2VBjkU-0h8RgPITgzzTb54kiBY8HwLSM9WZO0sYfvSeQA0DamsByrhxa0uFChG-7fC_NivqsM6mJFOmP8bw/file?c_luid=667ded1d"],["collect-gem","https://uc3ef074d6d36f752f39b0b94ad2.dl.dropboxusercontent.com/cd/0/get/DJ-EKe1Y761QS79dFeRbPXcZXd15zIskM-w3eRGOZYcfRGMPKK69c1QhNEbeCO4Aew48oDFFNosyvIe2D3N70WA6O1UtuTQMyJzFcxSd2US7OEelm155zxAypoVla54GT9VzRSEDKcDJ1vvV7XsDrwSo8e3e3EnwDplzb6fSrniJpQ/file?c_luid=667ded1d"],["hazard-rock","https://uc71c2de2f4406b39af9accd715b.dl.dropboxusercontent.com/cd/0/get/DJ-hWD2jeCocyA-aauW3d8X8cmtFuAsHIKRIlzVXPmdvzSrfcURsC27-fIVHLODRC75G-1WaT-W7WjAGyrI5ESABwgRxNd1TkPWc5NsnTnRt42uP5zcQpniGbDnqHVm_QDwjD2atScp0ZfpSTH-Y2rQpPcrW18hdQa-lO0hNZMJHbg/file?c_luid=667ded1d"],["hazard-spike","https://uc155cd16df7a933d2eb29a590bd.dl.dropboxusercontent.com/cd/0/get/DJ8OqGUfrwpm9y8B0o9OpJQXgX37SOYwmtw-QUPN1XNzclqSN-QUzcGBBSxY3RjlVLmBdcZi_9jcFvpFiPmWL7_mXjc-4KsYihVUumqly1e8L_MecfKwQ5YOXxz84CKBsO2goMaiPbYOTEi9DV7GVWaU-n0n5kiMdhJVRZmNx6fdAg/file?c_luid=667ded1d"],["collect-cache","https://uc66297163e391b64794f778bc09.dl.dropboxusercontent.com/cd/0/get/DJ-ScnEAWWT4EKERxLUHL4BpnszarfhgU1LZ0LLR-uOzcxmLrcKRKUODdsZ_tr87mbWyApJ3dBJ7QlMuqLDaBm55ynTfH8pFY_5GN-HWnbrg8sLBx69Jokvf5CdiVwrOn2NCVzPMcWWI8txGXWzFvP83DsSWJpu4ZrqIPsVdi2azRg/file?c_luid=667ded1d"]]
            DEST = Path('public/ember-drill')
            DEST.mkdir(parents=True,exist_ok=True)
            renames={
            "01 - Rosie Drill Static Body.webp":"drill-body.webp",
            "02 - Auger Spin Eight Frames.png":"auger-spin.png",
            "03 - Burrow Turbo Animated Overlay.webp":"turbo-animation.webp",
            "04 - Barkroot Far Scenic Loop.webp":"barkroot-loop.webp",
            "05 - Ruby Temple Far Scenic Loop.webp":"ruby-loop.webp",
            "06 - Barkroot Roots Foreground.webp":"roof-roots.webp",
            "07 - Ruby Crystal Foreground.webp":"floor-ruby.webp",
            "08 - Treasure Cache Burst Sprite Sheet.webp":"cache-burst.webp",
            "09 - Hazard Warning Pulse.webp":"hazard-pulse.webp",
            "10 - Golden Bone Relic Reveal.webp":"golden-bone.webp",
            }
            for kind,url in FILES:
                req=urllib.request.Request(url,headers={'User-Agent':'RosieArtImporter/1.0'})
                with urllib.request.urlopen(req,timeout=90) as rsp:
                    data=rsp.read()
                if kind=='pack':
                    with zipfile.ZipFile(io.BytesIO(data)) as z:
                        for name,newname in renames.items():
                            matches=[path for path in z.namelist() if path.endswith(name)]
                            if not matches: raise RuntimeError('Missing '+name)
                            (DEST/newname).write_bytes(z.read(matches[0]))
                    continue
                image=Image.open(io.BytesIO(data))
                if kind=='header':
                    image=ImageOps.fit(image.convert('RGB'),(1280,350),method=Image.Resampling.LANCZOS,centering=(.5,.48))
                    image.save(DEST/'drill-header.webp','WEBP',quality=89,method=6)
                elif kind.startswith('scenic-'):
                    image=image.convert('RGB').resize((2048,684),Image.Resampling.LANCZOS)
                    image.save(DEST/(kind+'.webp'),'WEBP',quality=84,method=6)
                else:
                    image=image.convert('RGBA')
                    bounds=image.getchannel('A').getbbox()
                    if bounds:image=image.crop(bounds)
                    image.thumbnail((450,450),Image.Resampling.LANCZOS)
                    out=Image.new('RGBA',(512,512))
                    out.alpha_composite(image,((512-image.width)//2,(512-image.height)//2))
                    out.save(DEST/(kind+'.webp'),'WEBP',quality=88,method=6)
                print('Imported',kind)
            assert len(list(DEST.glob('*')))==len(renames)+len(FILES)-1
            print('Assets ready:',len(list(DEST.glob('*'))))
            
          PY
      - name: Commit integrated visuals
        run: |
          git config user.name "rosie-art-importer[bot]"
          git config user.email "rosie-art-importer@users.noreply.github.com"
          git add public/ember-drill
          git diff --cached --quiet || git commit -m "Import game-ready Rosie Ember Drill art from Dropbox"
          git push origin HEAD:work/ember-drill-barkroot-ruby-milestone
