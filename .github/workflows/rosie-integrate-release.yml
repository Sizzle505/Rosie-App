name: Rosie integrated release - QR, Timekeepers, Haiku
on:
  push:
    branches:
      - release/20261120-qr-timekeeper-haiku
    paths:
      - .github/workflows/rosie-integrate-release.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge compatible development branches
        run: |
          set -euo pipefail
          git config user.name 'Rosie App integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin timekeeper-desktop-collection feature/rosie-haiku-garden fix/qr-viewer-finish-title-close-20261120
          git merge --no-ff -X theirs origin/timekeeper-desktop-collection -m 'Integrate Timekeepers desktop collection and controls'
          git merge --no-ff -X theirs origin/feature/rosie-haiku-garden -m 'Integrate latest Haiku Garden and Calculations offsets'
          git merge --no-ff -X theirs origin/fix/qr-viewer-finish-title-close-20261120 -m 'Integrate QR framed viewer and selected finishes'
      - name: Import three approved frame PNGs from Dropbox
        env:
          ROSIE_SEATED_URL: "https://uc48fd3881264eed0885217cb6c3.dl.dropboxusercontent.com/cd/0/get/DMU504SEsO6SeKjJfAVnj-4MfVSBaN3x6J8SiETWsR1jK8wolKD83Th09vYTgZzeYPcLwY-mDqYhAElDd9A85BAWnWm2SNc-ykpfxSowFoppvYwdGT9Q4mzIggmobGhNVHiCKOTTBItmJNAV-1WbB8qOMO-HJe6ulAM7gH-aipqfjQ/file?c_luid=667ded1d"
          ROSIE_PRESENT_URL: "https://ucf4bed7194688ba10c8438993a8.dl.dropboxusercontent.com/cd/0/get/DMVi6fAa2NDJvf2J66KFMbLOg6w2iIFodO_IaMEfAAOkTD9f2ex7wauIE0JMv1lXrGCCo_2Hufh0F6v42C_oUmA9-1ZPoJrRGWUb9t7TU5KVpf1J3SpvedwbKUkgU-ooWm-qq7jLrnu2NhXpSvwPVDFUlN_7yCo7XvXCHn4cAp5-bg/file?c_luid=667ded1d"
          ROSIE_GILDED_URL: "https://uc93a32d867fe43d924bf9d4510f.dl.dropboxusercontent.com/cd/0/get/DMX0Wq_yQz81__TqW_-zSdU6wB65ToUK1tl2hTskvFKhA5uW72x-hvJt2yhJwBxWuIpozKk_VhJ20fctzZSRsmwdMRdXOON63ynQekoarNimcWuQEoq_xdXfI-XRvHEnaMVzT58Ku-a2Ag_VdmXTzkn2RE4x6BiimFKtf_EQOPaEjA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, hashlib, urllib.request
          base=pathlib.Path('public/qr-atelier/rosie-qr')
          assets=[
              ('ROSIE_SEATED_URL','rosie-frame-seated-hollow.png','402aa1e5718d8f4efa821ed3f0a68a8a55d30cd6b4d61380534d9efd86ab826c'),
              ('ROSIE_PRESENT_URL','rosie-frame-presenting-hollow.png','54f7e99807992b86d586a48c084b12ccb5abf5d30a0098e8cda07252a0368505'),
              ('ROSIE_GILDED_URL','rosie-frame-blank-hollow.png','893aef5c3ce3f105487a283ad467049938e289a649d363649d2362c7c155ae6e'),
          ]
          for key,name,expected in assets:
              with urllib.request.urlopen(os.environ[key],timeout=60) as response: data=response.read()
              digest=hashlib.sha256(data).hexdigest()
              if digest!=expected: raise RuntimeError(name+' Dropbox SHA-256 mismatch: '+digest)
              if not data.startswith(bytes((137,80,78,71,13,10,26,10))): raise RuntimeError(name+' is not PNG')
              (base/name).write_bytes(data)
              print('VERIFIED',name,len(data),digest)
          PY
      - name: Use only approved frames and preserve original Curious Rosie
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/RosieQrAtelier.jsx')
          s=path.read_text()
          for name in ('seated','presenting','blank'):
              old='rosie-frame-'+name+'-hollow.webp'
              new='rosie-frame-'+name+'-hollow.png'
              if old in s: s=s.replace(old,new)
              assert s.count(new)==1,(new,s.count(new))
          old='rosie-frame-peeking-hollow.webp'
          if old in s: s=s.replace(old,'rosie-frame-peeking.webp')
          assert s.count('rosie-frame-peeking.webp')==1
          if 'cutRosieFrame' in s or 'rosieHoleTransform' in s or 'maskId=' in s:
              raise RuntimeError('Unsafe browser-side frame carving remains')
          path.write_text(s)
          PY
          git rm -f --ignore-unmatch public/qr-atelier/rosie-qr/rosie-frame-seated-hollow.webp public/qr-atelier/rosie-qr/rosie-frame-presenting-hollow.webp public/qr-atelier/rosie-qr/rosie-frame-blank-hollow.webp public/qr-atelier/rosie-qr/rosie-frame-peeking-hollow.webp
          git rm -f --ignore-unmatch .github/workflows/qr-hollow-assets.yml .github/workflows/qr-hollow-browser.yml scripts/make-qr-frames-hollow.py scripts/qrHollowViewerBrowserCheck.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate production bundle
        run: |
          npm ci
          npm run build
      - name: Commit integrated and tested branch
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Release candidate: Haiku, Timekeepers and three approved QR frame assets'
          git push origin HEAD:release/20261120-qr-timekeeper-haiku
