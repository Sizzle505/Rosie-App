name: Import Rosie Resources button artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-rosie-resources-buttons-20261013.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Transfer the approved original PNGs from Dropbox
        env:
          QR_SOURCE: "https://uc670523e9637af7ef1c877b333c.dl.dropboxusercontent.com/cd/0/get/DJ4gDxUtt2-O0BIve8IH-25U5-P6zR-cDrXuL74A_ReHjrEW8ivOQvjZS-Sv1EzimuJPkFbQFoMAyh6EPuZlnyWEtXKHO_IF4BvMjnRsxGewH90XiHV8XpoSYt2XkhqpAOVeSmla32pWJMgXqOg6MhItKxSGt5JGbx2Qszdq4vQ8GA/file?c_luid=667ded1d"
          RECIPES_SOURCE: "https://uc5c1b3bb8866ac010160e8853cd.dl.dropboxusercontent.com/cd/0/get/DJ6SYTEV6LRvNABi4L2OfR0i7H24Nw-FhuR36q5Yw84pR5KwSagl8OjHJjEN0p8sH-orF15bLhWdt09ms3rggrxi_eu5v4Fgvrgt1WoTZxEeXwb7zfYiyT8zZctYDtYz0RHBaH_a8ax3X3EcLD7EziWFz5WDpoahkR6dPqsMsyPxkA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          mkdir -p public/rosieverse/resources
          curl -fLsS --connect-timeout 20 --max-time 120 "$QR_SOURCE" -o public/rosieverse/resources/qr-atelier.png
          curl -fLsS --connect-timeout 20 --max-time 120 "$RECIPES_SOURCE" -o public/rosieverse/resources/recipes.png
          python3 - <<'PY'
          from pathlib import Path
          for name in ('qr-atelier.png', 'recipes.png'):
              p = Path('public/rosieverse/resources') / name
              data = p.read_bytes()
              if not data.startswith(bytes([137,80,78,71,13,10,26,10])) or len(data) < 100000:
                  raise RuntimeError(f'Invalid button PNG: {p} ({len(data)} bytes)')
              print(f'Verified {p}: {len(data)} bytes')
          PY
      - name: Commit original images to the Rosie App
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rosieverse/resources/qr-atelier.png public/rosieverse/resources/recipes.png
          git diff --cached --quiet || (git commit -m "Add approved QR Atelier and Recipes Resources button art" && git push)
