name: Correct Source Frame Masking
on:
  push:
    paths:
      - '.github/workflows/correct-calculations-frame-mask.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/work/calculations-mythic-functional-devices-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow numpy scipy
      - name: Recover original approved frame
        env:
          ROSIE_APPROVED_ORIGINAL: "https://uc624be725c7a674636198b2a214.dl.dropboxusercontent.com/cd/0/get/DJ0wyikZIK22u4d4DFSt1AAfYFSURT1y-hyJMREz7Uv99fn9Asw7gLicy8e4sXDyml0ASa_Vzm8pk65hFUTMgZDnI7asFCsv6NpZdX-jlnmenz4mdBKa-P1HRSiGymIbaf-GAaYbPtjOwyZSAKAe_WItyFMRZjPJ-WIAE37kpA-vHg/file?c_luid=667ded1d"
        run: curl -fLsS --retry 2 -o /tmp/approved-original.png "$ROSIE_APPROVED_ORIGINAL"
      - name: Preserve original gold and scarlet shadows
        run: |
          python - <<'PY'
          from PIL import Image
          from scipy.ndimage import binary_propagation,gaussian_filter
          import numpy as np
          from pathlib import Path
          dest=Path('public/rosieverse/calculations/toolkit')
          im=Image.open('/tmp/approved-original.png').convert('RGB')
          assert im.size==(1122,1402),im.size
          px=np.array(im)
          near_black=px.max(axis=2)<=22
          seed=np.zeros(near_black.shape,bool)
          seed[0,:]=near_black[0,:];seed[-1,:]=near_black[-1,:]
          seed[:,0]=near_black[:,0];seed[:,-1]=near_black[:,-1]
          # Only pixels connected to the outer backdrop are transparent.
          # Shadow details INSIDE the gold device must retain their original pixels.
          exterior=binary_propagation(seed,mask=near_black)
          alpha=np.rint(np.clip(1-gaussian_filter(exterior.astype('float32'),sigma=.7),0,1)*255).astype('uint8')
          assert alpha[0,0]==0
          assert alpha[300,569]==255,'Internal relief shadows were erased'
          rgba=Image.fromarray(np.dstack((px,alpha)),'RGBA').crop((0,0,1122,1391))
          crops={
            'gold-device.webp':(0,0,1122,1391),
            'housing-top.webp':(0,0,1122,353),
            'housing-bottom.webp':(0,1034,1122,1391),
            'housing-center.webp':(180,318,942,1076),
            'housing-rail-left.webp':(0,345,190,520),
            'housing-rail-right.webp':(932,345,1122,520),
            'housing-cheese.webp':(0,553,210,772),
            'housing-shiba.webp':(912,553,1122,772)
          }
          for name,rect in crops.items():
            artifact=rgba.crop(rect)
            artifact.save(dest/name,'WEBP',lossless=True,method=6,exact=True)
            print(name,artifact.size,(dest/name).stat().st_size)
          PY
      - name: Commit accurate source-derived images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/calculations/toolkit
          git commit -m "Preserve original metallic shadows and gold frame in full fidelity" || exit 0
          git fetch origin work/calculations-mythic-functional-devices-20261011
          git rebase origin/work/calculations-mythic-functional-devices-20261011
          git push origin HEAD:work/calculations-mythic-functional-devices-20261011
