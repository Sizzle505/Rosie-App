name: QR Preview Pixel-Geometry Verification (temporary)
on:
  push:
    branches: [fix/qr-viewer-finish-title-close-20261120]
    paths:
      - src/RosieQrAtelier.jsx
      - src/rosie-qr-viewer.css
      - scripts/qa-final-popup-render.mjs
      - .github/workflows/qa-final-popup-render.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Start local Vite build
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/qa-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/qa-vite.log
          exit 1
      - run: node scripts/qa-final-popup-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-final-composition-shots
          path: qr-review-shots/*.png
          retention-days: 2
          if-no-files-found: ignore
