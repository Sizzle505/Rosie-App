name: Ember Drill iPhone browser QA
on:
  push:
    branches:
      - work/ember-drill-barkroot-ruby-milestone
    paths:
      - scripts/verify_ember_drill.mjs
      - .github/workflows/ember-iphone-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build Rosie App
        run: |
          npm ci
          npm run build
      - name: Install iPhone browser automation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run actual portrait-browser gameplay tests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ember-preview.log 2>&1 &
          sleep 4
          node scripts/verify_ember_drill.mjs
      - name: Preserve portrait captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-drill-iphone-pictures
          path: artifacts/ember-drill/
          if-no-files-found: ignore
