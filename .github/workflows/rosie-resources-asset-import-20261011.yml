name: Install approved Rosie Resources button
on:
  push:
    branches:
      - work/rosie-resources-integrated-20261011
    paths:
      - '.github/workflows/rosie-resources-asset-import-20261011.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify the supplied artwork
        env:
          FILE_URL: 'https://uc39e7145e7db2e97287e879f4ed.dl.dropboxusercontent.com/cd/0/get/DJ1xlVnVhPRqNS1aHJpebTbeR7W-hLf9c8SRoz3bGhaeXCFxByKFVIS0zt0AJT2U0nqfsGunJnZOkYU9-PxNbqseVUf4ve8QIB3QnWjJtCtkVMt1Ulut5fw2Zj2CKJmu1qaGiTgSxNYtel-45u-va5vA8-DjsM99ZgfhijbZqDdjzQ/file?c_luid=667ded1d'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/rosieverse/buttons
          curl --fail --location --silent --show-error --max-time 100 "$FILE_URL" --output /tmp/rosie-resources-original.png
          echo 'c1f56bd9b658781a95bbbc5cc54dd0d561387839826bb31f9b057f0390b60614  /tmp/rosie-resources-original.png' | sha256sum --check --status
          python3 - <<'PY'
          import struct
          p='/tmp/rosie-resources-original.png'
          data=open(p,'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Source must be PNG'
          assert struct.unpack('>II',data[16:24]) == (2172,724), 'Unexpected dimensions'
          assert len(data) == 2889718, 'Unexpected byte length'
          print('Original artwork verified: 2172 x 724, 2,889,718 bytes')
          PY
          mv /tmp/rosie-resources-original.png public/rosieverse/buttons/resources.png
      - name: Commit verified image and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/rosie-resources-asset-import-20261011.yml
          cat > public/rosieverse/buttons/RESOURCES-ASSET-README.md <<'EOF'
          # Rosie’s Resources button

          The approved original 2172 × 724 transparent PNG is installed at
          `public/rosieverse/buttons/resources.png`, unchanged.

          It is rendered by `src/RosieHome.jsx` as the full-width sixth
          destination on the Grand Salon landing page; its button navigates to
          `#resources` with links to Reminders, Calculations and Timekeeper.
          EOF
          git add public/rosieverse/buttons/resources.png public/rosieverse/buttons/RESOURCES-ASSET-README.md
          git commit -m "Install original Rosie Resources Grand Salon button"
          git push origin "HEAD:${GITHUB_REF_NAME}"
