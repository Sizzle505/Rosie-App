        run: python scripts/import_ember_feature_art.py
      - name: Commit game artwork
        run: |
          git config user.name "rosie-art-importer[bot]"
          git config user.email "rosie-art-importer@users.noreply.github.com"
          git add public/ember-drill/feature-*.webp public/ember-drill/feature-manifest.json
