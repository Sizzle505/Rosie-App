name: Import Ember feature art (one time)
on:
  push:
    branches: ["work/ember-drill-barkroot-ruby-milestone"]
    paths:
      - ".github/workflows/ember-feature-import.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "work/ember-drill-barkroot-ruby-milestone"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
