name: Yacht Dash chapter expansion - build and engine tests
on:
  pull_request:
    branches: [main]
    paths:
      - src/main.jsx
      - src/yachtDashExpansion.js
      - src/yachtDashExpansion.css
      - src/yachtDashExpansion.test.js
      - src/CaptainSceneryTransition.jsx
      - src/CaptainOuterAtmosphere.jsx
      - public/yacht-dash/**
      - .github/workflows/yacht-dash-expansion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate scene order, safe lanes and unlock behavior
        run: node --test src/yachtDashExpansion.test.js
      - name: Build Vite app
        run: npm run build
      - name: Report pending art import
        run: |
          if [ -d public/yacht-dash ]; then
            echo "Art folder exists; inspect all assets before release."
          else
            echo "::warning::Approved binary art still staged in Dropbox ZIP; see docs/Yacht-Dash-Expansion-Asset-Import.md"
          fi
