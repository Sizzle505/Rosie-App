name: Rosie Reminders utility checks
on:
  push:
    branches:
      - work/reminders-utility-upgrade-20261014
    paths:
      - 'src/RosieReminders.jsx'
      - 'src/RosieReminders.css'
      - 'src/reminderLogic.js'
      - 'src/private/PrivateNotes.jsx'
      - 'src/private/PrivateNotes.module.css'
      - 'tests/reminders-utility-browser.mjs'
      - 'tests/reminder-logic.test.mjs'
      - '.github/workflows/rosie-reminders-utility.yml'
  pull_request:
    paths:
      - 'src/RosieReminders.jsx'
      - 'src/RosieReminders.css'
      - 'src/reminderLogic.js'
      - 'src/private/PrivateNotes.jsx'
      - 'src/private/PrivateNotes.module.css'
      - 'tests/reminders-utility-browser.mjs'
      - 'tests/reminder-logic.test.mjs'
      - '.github/workflows/rosie-reminders-utility.yml'
permissions:
  contents: read
jobs:
  reminders-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/reminder-logic.test.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start Vite dev server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rosie-reminders-utility.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rosie-reminders-utility.log
          exit 1
      - run: node tests/reminders-utility-browser.mjs
