name: One-time RosieVerse living-scenery browser QA
on:
  push:
    branches: [work/rosieverse-living-scenery-no-black-gaps-20261009]
    paths: [.github/workflows/rosieverse-living-qa.yml]
permissions:
  contents: write
jobs:
  check-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install and build
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium
          npm run build
      - name: Launch preview
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/rosieverse-living.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
      - name: Real browser motion, image, layout and navigation verification
        run: |
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('rosieverse-living-qa',{recursive:true});
          const report={ref:process.env.GITHUB_SHA,tests:[],errors:[]};
          const sizes=[[390,844],[375,667],[320,650],[768,1024],[1440,900]];
          for (const [engine,browserType] of [['webkit',webkit],['chromium',chromium]]) {
            const browser=await browserType.launch({headless:true});
            for (const [w,h] of sizes) {
              const context=await browser.newContext({viewport:{width:w,height:h},isMobile:w<=390,hasTouch:w<=390,deviceScaleFactor:1});
              const page=await context.newPage();
              const consoleErrors=[];
              page.on('pageerror',e=>consoleErrors.push(e.message));
              await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'networkidle'});
              await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
              const buttons=page.locator('nav[aria-label="RosieVerse destinations"] button');
              await buttons.first().waitFor();
              const initial=await page.evaluate(async()=>{
                const root=document.querySelector('main[aria-label^="RosieVerse"]');
                const scenery=[...root.querySelectorAll('div')].find(el=>getComputedStyle(el).backgroundImage.includes('background-mobile.webp'));
                const water=[...root.querySelectorAll('div')].find(el=>getComputedStyle(el).animationName.includes('waterCurrent'));
                const canopy=[...root.querySelectorAll('div')].find(el=>getComputedStyle(el).animationName.includes('canopyBreatheLeft'));
                const cards=[...root.querySelectorAll('nav button')];
                const imgs=cards.map(el=>el.querySelector('img'));
                await Promise.all(imgs.map(img=>img.decode()));
                return {
                  docWidth:document.documentElement.scrollWidth,
                  docHeight:document.documentElement.scrollHeight,
                  buttons:cards.length,
                  src:imgs.map(img=>img.getAttribute('src')),
                  imagesLoaded:imgs.every(img=>img.complete&&img.naturalWidth>0),
                  glintMasks:cards.every(el=>getComputedStyle(el.querySelector('span')).maskImage!=='none'&&getComputedStyle(el.querySelector('span')).webkitMaskImage!=='none'),
                  petalCount:root.querySelectorAll('img[src*="/scenery/petals/"]').length,
                  waterPresent:!!water,
                  canopyPresent:!!canopy,
                  sceneryPresent:!!scenery,
                  waterTransform:water?.style.transform|| (water && getComputedStyle(water).transform),
                  backdropFilter:scenery&&getComputedStyle(scenery).filter,
                  gap:Math.round(cards[2].getBoundingClientRect().y-cards[0].getBoundingClientRect().bottom)
                };
              });
              if(initial.docWidth>w+2)report.errors.push(`${engine} ${w} horizontal overflow`);
              if(initial.buttons!==5||!initial.imagesLoaded)report.errors.push(`${engine} ${w} broken buttons`);
              if(!initial.waterPresent||!initial.canopyPresent||!initial.sceneryPresent||initial.petalCount!==16)report.errors.push(`${engine} ${w} missing scenic motion layer`);
              if(!initial.glintMasks)report.errors.push(`${engine} ${w} gold sheen not masked to frame`);
              if(initial.gap>8 || initial.gap < -25)report.errors.push(`${engine} ${w} nav gap ${initial.gap}`);
              if(consoleErrors.length)report.errors.push(`${engine} ${w} page exceptions: ${consoleErrors.join(';')}`);
              if(w===390 || w===1440) {
                await page.screenshot({path:`rosieverse-living-qa/${engine}-${w}x${h}.png`,fullPage:true});
                const m1=await page.locator('div').evaluateAll(els=>{
                  const target=els.find(el=>getComputedStyle(el).animationName.includes('waterCurrent'));
                  return target ? getComputedStyle(target).transform : 'missing';
                });
                await page.waitForTimeout(1800);
                const m2=await page.locator('div').evaluateAll(els=>{
                  const target=els.find(el=>getComputedStyle(el).animationName.includes('waterCurrent'));
                  return target ? getComputedStyle(target).transform : 'missing';
                });
                if(m1===m2||m1==='missing')report.errors.push(`${engine} ${w} water animation not progressing`);
                await page.screenshot({path:`rosieverse-living-qa/${engine}-${w}x${h}-motion.png`,fullPage:true});
              }
              if(w===390){
                const destinations=[['fortune','Fortune Teller'],['cheese','Cheese Board Exam'],['captain','Captain Rosie'],['vault','Card Vault'],['randomizers','Randomizers']];
                for(const [id,name] of destinations){
                  await page.getByRole('button',{name:'Open '+name}).click();
                  if(!page.url().endsWith('#'+id))report.errors.push(`${engine} ${w} bad route ${id}`);
                  await page.goto('http://127.0.0.1:4173/#home');
                  await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
                }
                await page.emulateMedia({reducedMotion:'reduce'});
                const reduced=await page.evaluate(()=>{
                  const root=document.querySelector('main[aria-label^="RosieVerse"]');
                  const animations=[...root.querySelectorAll('*')].filter(el=>['waterCurrent','scenicBreathing','framedGoldGlint','cinematicPetal'].some(n=>getComputedStyle(el).animationName.includes(n)));
                  return animations.length;
                });
                if(reduced)report.errors.push(`${engine} ${w} reduced motion still animates: ${reduced}`);
              }
              report.tests.push({engine,viewport:[w,h],...initial,exceptions:consoleErrors});
              await context.close();
            }
            await browser.close();
          }
          writeFileSync('rosieverse-living-qa/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({total:report.tests.length,errors:report.errors,viewports:report.tests.map(x=>({browser:x.engine,size:x.viewport,gap:x.gap,filter:x.backdropFilter}))},null,2));
          if(report.errors.length)process.exitCode=1;
          JS
      - name: Commit QA results for review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosieverse-living-qa || true
          git diff --cached --quiet || git commit -m "Capture RosieVerse cinematic WebKit and Chromium QA evidence [skip ci]"
          git push origin HEAD:refs/heads/work/rosieverse-living-scenery-no-black-gaps-20261009
