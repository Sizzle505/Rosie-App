name: QR Atelier artwork import
on:
  push:
    branches:
      - work/qr-atelier-foundation-20261012
    paths:
      - .github/workflows/qr-atelier-artwork-import.yml

permissions:
  contents: write

jobs:
  copy-approved-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Download transfer assets from temporary Dropbox links
        shell: bash
        env:
          QR_WORKSHOP: "https://uc1ed48c37c4b619104d06172765.dl.dropboxusercontent.com/cd/0/get/DJ59DONIYeNkX1c93XTgr0iMnCa65ZeQ2RfPBOhdvwkSFN7MqqXfEFUQaBP773D4Uy3HD1hSCJP6Fhx6KnCK5FwbMhnvhrUeP2bbMaLlXRyeLYO8ZARVEM9m-2ayG61S0DoYj6H-Ximz9GyIc6FmxnafT4g2tLmNKT78ZduNnbDaPw/file?c_luid=667ded1d"
          QR_RING: "https://ucc731b13e50774d706fa7a98703.dl.dropboxusercontent.com/cd/0/get/DJ4pNnSCbLnywNd-iGQhUBHLR0utJ7iM1tHGuRcU9A-luWz4aNURd7FeEWic0sbm0YErnM5HnBQN8DyPLLU-JcPouMoFwczZU_kx-1yj4sCbl2B010uEyKVb-vwgijybFwOSySZTuu_pGs6302hpO76Y96Ok_GRsEkLERpwULp0JtQ/file?c_luid=667ded1d"
          QR_PANEL: "https://ucb199c5863332c57b49af7cb0a6.dl.dropboxusercontent.com/cd/0/get/DJ44TDMLKlcvVgGCfLrBtJSY28SpS6oWvGBmkGg8p95fMreMSQfFo1MA4WPn3gfU1eI1lX_EY5yWG3eymKdLP_XohMB2C7Iga5AYb79XGhCb48F_ClqdPtIAn5XrOzYG3Iz-fL12hUL-cQFNJgqaakB7P0TJr4B2IKpGUNj90m2wQA/file?c_luid=667ded1d"
          QR_PRIMARY: "https://uca7fce9484ff0ec16fd3c7f58a0.dl.dropboxusercontent.com/cd/0/get/DJ4ip9WUyhiOwIluS3mm7mn8Z2WPnb_wVWnNMB_x_TQdYFjkxzt6OIu8qW7_yKhKrkPF1vzamWaehbVcwhcEtzvp8nisz1VqFa8EZgAy8AbcoMYyIaPcmcNcBzYssIL2vhXhOXu63ZXVN7vHKdFwwfcfLwI2rNg4mpSFusQYBvhZ8A/file?c_luid=667ded1d"
          QR_SECONDARY: "https://ucced34d7ea4e92d33253a5def59.dl.dropboxusercontent.com/cd/0/get/DJ40R76cTwBg5D4tPlvRFZ1drfTWGeG1c9tLtOcxfWnoD9mcOn012njAtEJMNXQT8RyKsBe4pJ_S1PwN4jLAwmUozUHHjTzapbUdq7qMwgEhAypI5HWhpRO5LVMceuZklyIdzcSsnGdM_hqtPwWqL1RR2wEY7CXp8h9yBm2DmVAw4g/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          mkdir -p /tmp/qr-atelier-transfer
          curl -fsSL --max-time 150 --output /tmp/qr-atelier-transfer/workshop.png "$QR_WORKSHOP"
          curl -fsSL --max-time 150 --output /tmp/qr-atelier-transfer/qr-frame.png "$QR_RING"
          curl -fsSL --max-time 150 --output /tmp/qr-atelier-transfer/form-panel.png "$QR_PANEL"
          curl -fsSL --max-time 150 --output /tmp/qr-atelier-transfer/primary-button.png "$QR_PRIMARY"
          curl -fsSL --max-time 150 --output /tmp/qr-atelier-transfer/secondary-buttons.png "$QR_SECONDARY"
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          sources = [
            ("workshop", 900),
            ("qr-frame", 1254),
            ("form-panel", 1122),
            ("primary-button", 1100),
            ("secondary-buttons", 1250),
          ]
          target=Path("public/qr-atelier")
          target.mkdir(parents=True,exist_ok=True)
          for name,maxwidth in sources:
              image=Image.open("/tmp/qr-atelier-transfer/"+name+".png")
              if image.format != "PNG":
                  raise ValueError("Expected PNG asset: "+name)
              image=image.convert("RGBA" if "A" in image.getbands() else "RGB")
              if image.width > maxwidth:
                  image=image.resize((maxwidth,round(image.height*maxwidth/image.width)),Image.Resampling.LANCZOS)
              image.save(target/(name+".webp"),"WEBP",quality=82,method=5)
              print("Created:",name, image.size)
          PY
      - name: Commit imported optimized artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/qr-atelier/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(qr): add approved atelier workshop and ornamental WebP layers'
            git push origin HEAD:work/qr-atelier-foundation-20261012
          fi
