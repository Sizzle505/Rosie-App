name: Ember OG source-derived iPhone visual QA
on:
  push:
    branches: ["work/ember-og-ribbon-prototype-20261014"]
    paths:
      - "src/emberTunnelRibbons.js"
      - "src/emberDrillPainter.js"
      - "src/EmberTunnelDrill.jsx"
      - "scripts/verify-ember-og-prototype.mjs"
      - "scripts/verify-ember-header-and-obstacles.mjs"
      - "src/emberTunnelLayout.js"
      - "tests/ember-tunnel-formations.test.mjs"
      - "src/emberTunnelSculpture.js"
      - "public/ember-drill/edge/**"
      - ".github/workflows/ember-og-iphone-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-iphone-canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build actual committed 36-source-derived Canvas game
        run: |
          npm ci
          node --test tests/ember-drill-engine.test.mjs tests/ember-tunnel-formations.test.mjs
          npm run build
      - name: Install iPhone-sized browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run portrait actual-runtime edge registration and steering tests
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/ember-og-preview.log 2>&1 &
          for n in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/verify-ember-og-prototype.mjs
          node scripts/verify-ember-header-and-obstacles.mjs
      - name: Keep unmodified gameplay evidence and exact sprite manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-original-Barkroot-iPhone-visual-evidence
          path: |
            artifacts/ember-og-prototype/
            artifacts/ember-og-header-audit/
            public/ember-drill/edge/edge-assets.json
          retention-days: 14
          if-no-files-found: ignore
