name: Install approved Sakura cheese artwork
on:
  push:
    branches:
      - fix/yacht-water-motion-and-pacing-20261123
    paths:
      - .github/workflows/yacht-cheese-transfer-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved transparent pickup
        env:
          TRANSFER_B64: ""
        run: |
          set -euo pipefail
          mkdir -p public/yacht-dash/pickups
          f=public/yacht-dash/pickups/sakura-golden-cheese.png
          curl --fail --location --max-time 120 "$(printf '%s' "$TRANSFER_B64" | base64 --decode)" --output "$f"
          echo "4ad71df06ef4ed647ef0b1cb05b06d7a84a21b28d7a72fb9b57d246e49f07756  $f" | sha256sum -c -
          python3 -c 'import struct; from pathlib import Path; b=Path("public/yacht-dash/pickups/sakura-golden-cheese.png").read_bytes(); assert len(b)==249955; assert b[:8]==bytes([137,80,78,71,13,10,26,10]); assert struct.unpack(">II",b[16:24])==(512,512); assert b[25]==6'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Install verified 512px transparent Sakura cheese pickup"
          git push origin HEAD:fix/yacht-water-motion-and-pacing-20261123
