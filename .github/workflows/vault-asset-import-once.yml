name: Vault asset import - temporary
on:
  push:
    branches:
      - 'work/vault-collector-polished-gunmetal-20261012'
    paths:
      - '.github/workflows/vault-asset-import-once.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified original art from Dropbox
        env:
          HEADER_URL: "https://ucd8da1bf3219dc8399bf0bc187c.dl.dropboxusercontent.com/cd/0/get/DJ5sahFn9rU1zOKR3vfcE7oCsKeA1xFqrWizfi-PpdpqC_1rPG2neUEjun35-Y9jzwKb3R8UhS36UqF7BgOpErb7y87IZOJvNwYW2CobTe0dFqPhUR98dT4WgQYJtqi6MY58eYxa9Mup6jCZLJ4E9CE0V93xw2DRApTm8yDCdsZ-Ow/file?c_luid=667ded1d"
          TILE_URL: "https://ucbc5ade4af5816d959881239ab1.dl.dropboxusercontent.com/cd/0/get/DJ5k_8-J1wJ38iAP7nsVnX8Fab16_-yLOb2T08D6xxIhmcXSc-0xiuVYfLA5GUNDDEyiAmN_ytb9-tOo3719h9yObbtrT4WPdZs9NP5AXPmgzBlGKpKflTRUiPNHwVV-N4oSG_ryVrsEI8PHod7sa2hTOX3ugexLAeFGilZR2HFRxg/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 1 "$HEADER_URL" -o /tmp/vault-header.png
          curl -fsSL --retry 2 --retry-delay 1 "$TILE_URL" -o /tmp/vault-metal.png
          echo 'af7d08f676724aef068340535100e0a915c81aa916cca0feb1ce23178a91975d  /tmp/vault-header.png' | sha256sum --check
          echo 'd13939cfff029a2d7a62e094ea7b42a12a13b9c9ad7e6d8818a9926a8bd65bb9  /tmp/vault-metal.png' | sha256sum --check
      - name: Convert original images to optimized high-quality WebP
        run: |
          python -m pip install Pillow
          mkdir -p public/card-vault
          python - <<'PY'
          from PIL import Image
          import numpy as np
          header=Image.open('/tmp/vault-header.png').convert('RGBA')
          tile=Image.open('/tmp/vault-metal.png').convert('RGB')
          assert header.size == (2172,724)
          assert tile.size == (1254,1254)
          a=np.asarray(tile,dtype=np.int16)
          assert np.max(abs(a[:,0,:]-a[:,-1,:])) == 0, 'Tile seam horizontally visible'
          assert np.max(abs(a[0,:,:]-a[-1,:,:])) == 0, 'Tile seam vertically visible'
          assert header.getchannel('A').getextrema() == (0,255)
          header.save('public/card-vault/vault-collector-header.webp',quality=95,method=6)
          tile.save('public/card-vault/vault-polished-gunmetal-tile.webp',quality=94,method=6)
          print('header', header.size, 'tile', tile.size, 'strictly seamless edges')
          PY
      - name: Verify integrated app builds
        run: |
          npm ci
          npm run build
          test -s dist/card-vault/vault-collector-header.webp
          test -s dist/card-vault/vault-polished-gunmetal-tile.webp
      - name: Commit assets and remove one-time downloader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/card-vault/vault-collector-header.webp public/card-vault/vault-polished-gunmetal-tile.webp
          git rm .github/workflows/vault-asset-import-once.yml
          git commit -m "assets(vault): import seamless polished metal and collector header through Dropbox"
          git push origin HEAD:work/vault-collector-polished-gunmetal-20261012
