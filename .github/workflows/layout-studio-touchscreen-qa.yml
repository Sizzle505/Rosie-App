name: Secret Layout Studio touchscreen browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/layout-studio-touchscreen-qa.yml
      - scripts/verify-secret-layout-studio.mjs
      - scripts/verify-layout-studio-v2.mjs
      - scripts/verify-layout-studio-desktop.mjs
      - src/layoutStudioAutoTargets.js
      - src/layoutTargets.js
      - src/RosieHome.jsx
      - src/layoutStudioGeometry.js
      - src/layoutTargets.js
      - src/SecretLayoutStudio.jsx
      - src/SecretLayoutStudio.css
      - src/layoutStudioScope.js
permissions:
  contents: read
jobs:
  touchscreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium automation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify advanced touchscreen interactions in isolated local browser
        env:
          BASE_URL: http://127.0.0.1:5173
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/rosie-layout-vite.log 2>&1 &
          sleep 4
          node scripts/verify-layout-studio-v2.mjs
          node scripts/verify-layout-studio-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-layout-touch-qa
          path: artifacts/secret-layout-studio/
          if-no-files-found: ignore
