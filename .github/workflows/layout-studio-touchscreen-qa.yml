name: Secret Layout Studio touchscreen browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/layout-studio-touchscreen-qa.yml
      - scripts/verify-secret-layout-studio.mjs
permissions:
  contents: read
jobs:
  touchscreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium automation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify touch unlock, multi-select drag, multi-page save and exact-width isolation
        env:
          BASE_URL: https://rosie-app-qvlffxa6c-apex-7488.vercel.app
        run: node scripts/verify-secret-layout-studio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-layout-touch-qa
          path: artifacts/secret-layout-studio/
          if-no-files-found: ignore
