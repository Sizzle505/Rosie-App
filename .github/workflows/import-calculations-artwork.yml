name: Import Approved Rosie Calculations Artwork
on:
  push:
    paths:
      - '.github/workflows/import-calculations-artwork.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/work/calculations-mythic-functional-devices-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image utility
        run: python -m pip install --quiet Pillow
      - name: Fetch approved assets byte for byte from Rosie-App-Transfer
        env:
          SRC_DEVICE: "https://ucbb314098376a7ed4a7b403a132.dl.dropboxusercontent.com/cd/0/get/DJ3qw0Mx4FuRhvkLGeRUt6oDEM95ByxCrh5m4qh-wpgIlqPmgsHIQbepQi7EgR_Tph_d4jNvo8a_5wKxmg5NT3kPHAVgp1Ct8bOCOTcrTH-IZfVwMDlbgnRkXoH6zJluPfDEidyzDcyzqRg9LxR-mQz-arJj1YM7Oe1T4USh0jtfiQ/file?c_luid=667ded1d"
          SRC_BUTTONS: "https://uca326ab8825924f851f01d6c2aa.dl.dropboxusercontent.com/cd/0/get/DJ0RQtKtWiDFv5hoBNjIBhRdZipyZErL4xzKtCGzDwHoBNgRXB_g4uvOfBc3hE-l38hFaH4Ol3gzfogDB2ECp2oYMBMzbxirnQ-nj-WFBAgy6Noo0BYCxjGO6FYyaW2w0tYRycFGzSfu04XW0VXi_VPrGpgfHSRRwGJdrcBonP_zZQ/file?c_luid=667ded1d"
          SRC_FIELD: "https://uc04e7eef580fb991a7cb6427f7c.dl.dropboxusercontent.com/cd/0/get/DJ3EEeM6uP2TtI2ku9Z9Fl_ml9Z1gbGPpK-l2fXjYbXLQYj2fzjJ_-S_4NUCu615EIpnCzSPGk57nGKLB-Pu7J5xcyQ10tmm_2jDpsXW6PyI4IVwevjMrJ3ZwQGJhAS6U5oyXd-XJo5IVf-P2InlnHiWseJkDY45FcU78Rf8fcpGJA/file?c_luid=667ded1d"
          SRC_SELECT: "https://uccbc731f71dffbb6671bb4ad08c.dl.dropboxusercontent.com/cd/0/get/DJ2HzEmHYZccIkVsIPPzlCLK1j2IFUhCTDDbzKHkRCkfVi89FK0dis18RqiezkRz-6BJv2Ln0stsIbCg_MP8DxzvzqTHmopxqPSuGSVBYmTqJhykkVXrK2Z2QjfWfoO383Qi75U9C9DVHbo5nE7zYMWTXk39iiJoze_KKr0ammG8dw/file?c_luid=667ded1d"
          SRC_RESULT: "https://uca518c34a50d84c862da04a22cc.dl.dropboxusercontent.com/cd/0/get/DJ0s450ttfp1idzKy2Km2Hi4E1io-q0qGwgiLfj_JEOdfP94nmUNRVasJe8tLRS95KmKadJAwqdJAG6em-B-vJ4TOeb5Efopua3dLh-3BPfFruQ_y_u4WPOCB7IyQbg9bijYDT-ejORtQVE4f5HAFdJzTNHwZx24EYz0GwSKQlywxg/file?c_luid=667ded1d"
        run: |
          mkdir -p /tmp/rosie-calculation-art
          curl -fLsS --retry 2 -o /tmp/rosie-calculation-art/device.png "$SRC_DEVICE"
          curl -fLsS --retry 2 -o /tmp/rosie-calculation-art/buttons.png "$SRC_BUTTONS"
          curl -fLsS --retry 2 -o /tmp/rosie-calculation-art/field.png "$SRC_FIELD"
          curl -fLsS --retry 2 -o /tmp/rosie-calculation-art/select.png "$SRC_SELECT"
          curl -fLsS --retry 2 -o /tmp/rosie-calculation-art/result.png "$SRC_RESULT"
      - name: Create deployable images from approved source only
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('/tmp/rosie-calculation-art')
          dest=Path('public/rosieverse/calculations/toolkit')
          dest.mkdir(parents=True,exist_ok=True)
          def quality_save(im,name,maxwidth=1250):
              im=im.convert('RGBA')
              box=im.getbbox()
              if box: im=im.crop(box)
              if im.width>maxwidth:
                  im.thumbnail((maxwidth,9999),Image.Resampling.LANCZOS)
              im.save(dest/name,'WEBP',quality=96,method=6)
              print(name,im.size,(dest/name).stat().st_size)
          frame=Image.open(root/'device.png').convert('RGB')
          # The source image has black RGB around the gold instrument.
          # Only near-black exterior pixels are removed; opaque gold, ruby and the Shiba ornaments remain untouched.
          from PIL import ImageDraw,ImageFilter
          import numpy as np
          pixels=np.asarray(frame).astype('int16')
          # background is black; exclude dark-red interior by combining channels
          bright=np.max(pixels,axis=2)
          alpha=np.clip((bright-8)*255/32,0,255).astype('uint8')
          frame_rgba=frame.convert('RGBA')
          frame_rgba.putalpha(Image.fromarray(alpha))
          quality_save(frame_rgba,'gold-device.webp',1250)
          field=Image.open(root/'field.png')
          select=Image.open(root/'select.png')
          result=Image.open(root/'result.png')
          quality_save(field,'gold-input.webp',1300)
          quality_save(select,'gold-select.webp',1300)
          quality_save(result,'gold-result.webp',1000)
          sheet=Image.open(root/'buttons.png').convert('RGBA')
          bounds={
            'tip':(8,182,546,428),
            'units':(555,182,1093,428),
            'date':(8,438,546,686),
            'split':(555,438,1093,686),
            'percent':(8,693,546,938),
            'loan':(555,693,1093,938),
            'currency':(8,947,1093,1193)
          }
          for name,box in bounds.items():
              quality_save(sheet.crop(box),'button-'+name+'.webp',1100)
          PY
      - name: Commit authentic source-derived artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/calculations/toolkit
          git commit -m "Import authentic gold device, field and seven selector artworks" || exit 0
          git push origin HEAD:work/calculations-mythic-functional-devices-20261011
