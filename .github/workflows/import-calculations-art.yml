name: Import desktop Calculations artwork
on:
  push:
    paths:
      - '.github/workflows/import-calculations-art.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image codec
        run: python -m pip install -q Pillow==11.3.0
      - name: Import three approved desktop assets from Dropbox transfer
        env:
          ART_HEADER: 'https://uc4f113b8d657b2318ed7b90cc90.dl.dropboxusercontent.com/cd/0/get/DK_biPW9kUdtEC3WayVVIdp8OzCR0p1wsuyU2r9403Co6G-2zqE5ltyyHR2a4wH0TeZZyjvobKJRaOz-q0SPxNRwBd-iozpwK5c5GnN0tFrDr6iYNHMn0VfK3NtS6MvRyzzjNKW_12L3nEdr3I5Ky3wJD5WiIkylY86K-XKSP_eLIA/file?c_luid=667ded1d'
          ART_VELVET: 'https://uc732bff573ea4c20f70b3742290.dl.dropboxusercontent.com/cd/0/get/DK8dT_tclFDoX5DPhm7rPJ_S1axq_4m6rnbJuv-zHzBbfE-T8KNT3lqCVgEhvBFkYWFVeh6lri9z67-9xFB6F-OlfkeERPm1wNgSCowMVTOaBuxQNuN4F7BJhkOgdXnvWXEa8R5jOYQasutOqWGVGg7qiGoP8CFa4KfGpiIc0j8TOw/file?c_luid=667ded1d'
          ART_WORKSPACE: 'https://uc700b5bd1050633b659c7b7df6f.dl.dropboxusercontent.com/cd/0/get/DK9K23kTXmvcvKHH4CJ4eI2TytNA9HfCP9p-VLv8xTNQG-53bcwh4BFW4WkVncrGr97ODoexvEnr22AkwAZVeQL4bto7LCTsuVxuD5IHn_7PM4T5Dcny5BRBp8aULUnjVLaxSCEb63jLZINy1kr3r5LvdPyqmpHCaXWh31IRbBfcMg/file?c_luid=667ded1d'
        run: |
          set -euo pipefail
          mkdir -p public/rosieverse/calculations/desktop-20261029
          cd public/rosieverse/calculations/desktop-20261029
          curl -fLsS --retry 1 --max-time 90 "$ART_HEADER" -o desktop-golden-header.png
          curl -fLsS --retry 1 --max-time 90 "$ART_VELVET" -o desktop-velvet-background.png
          curl -fLsS --retry 1 --max-time 90 "$ART_WORKSPACE" -o desktop-ornate-workspace.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, width, quality in [('desktop-golden-header',1900,80),('desktop-velvet-background',1600,77),('desktop-ornate-workspace',1600,80)]:
              path = Path(name + '.png')
              im = Image.open(path).convert('RGB')
              if im.width > width:
                  im = im.resize((width, round(im.height * width / im.width)), Image.Resampling.LANCZOS)
              output = Path(name + '.webp')
              im.save(output, 'WEBP', quality=quality, method=6)
              assert output.stat().st_size > 10000
              print(name, im.size, output.stat().st_size)
              path.unlink()
          PY
      - name: Commit durable optimized artwork to source
        run: |
          git config user.name 'Rosie Art Import'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/rosieverse/calculations/desktop-20261029/
          git commit -m 'Add original Calculations desktop artwork from Dropbox [skip ci]'
          git push origin HEAD:main
