name: Remaining games and QR finish release QA
on:
  push:
    branches: [release/20261120-remaining-games-qr-finish]
    paths:
      - .github/workflows/remaining-release-qa.yml
      - scripts/remainingReleaseQA.mjs
      - src/RosieQrAtelier.jsx
      - src/rosie-qr-viewer.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Yacht and Ember game engines
        run: |
          node --test src/yachtDashExpansion.test.js
          node --test tests/ember-drill-engine.test.mjs tests/ember-expedition-stages.test.mjs tests/ember-boss-encounter.test.mjs
          node --test pet-template-lab/scripts/test-prepare.mjs
          node --test src/qrAtelierLogic.test.js
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/rosie-final-qa.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:4173/ >/dev/null
      - name: Browser QR finish, Yacht and Haiku QA
        run: node scripts/remainingReleaseQA.mjs
      - name: Pixel-check visible burgundy against emerald behind QR artwork
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('qa-screenshots/remaining-release')
          e=Image.open(root/'iphone-emerald-rosie-frame-blank-hollow.png.png').convert('RGB')
          b=Image.open(root/'iphone-burgundy-rosie-frame-blank-hollow.png.png').convert('RGB')
          # The transparent opening's left side, outside the white QR square.
          # These snapshots are cropped to the composition at 2x iPhone DPR.
          x,y=260,270
          emerald=e.getpixel((x,y));burgundy=b.getpixel((x,y))
          print('MATERIAL PIXEL', (x,y), 'emerald',emerald,'burgundy',burgundy)
          diff=sum(abs(a-z) for a,z in zip(emerald,burgundy))
          if diff<40: raise SystemExit('Selected QR material did not visibly change: '+str(diff))
          print('PASS: selected material visible and changes color in actual QR frame opening')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-release-screenshots
          path: qa-screenshots/remaining-release/*.png
          retention-days: 7
