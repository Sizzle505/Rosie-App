name: Madame Rosie layer prep - sandbox only
on:
  push:
    branches:
      - work/madame-rosie-static-registration-20261011
    paths:
      - 'scripts/fortune_layer_builder.py'
      - '.github/workflows/madame-rosie-layer-prep.yml'
permissions:
  contents: write
jobs:
  build-source-locked-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/madame-rosie-static-registration-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Isolate source-registered layers
        run: python scripts/fortune_layer_builder.py --source public/rosie-fortune-stage.webp --out public/fortune-layer-drafts
      - name: Commit draft layers to sandbox branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/fortune-layer-drafts
          if ! git diff --cached --quiet; then
            git commit -m "Generate source-registered Madame Rosie draft alpha assets"
            git push
          fi
