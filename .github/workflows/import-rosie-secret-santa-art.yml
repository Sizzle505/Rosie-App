name: Import approved Rosie Secret Santa art
on:
  push:
    branches: ['feature/rosie-secret-santa-20261115']
    paths:
      - '.github/workflows/import-rosie-secret-santa-art.yml'
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Transfer the approved ZIP from Dropbox without publishing its link in logs
        env:
          DOWNLOAD_URL: "https://ucdfc71937dc954bd3f72933dd90.dl.dropboxusercontent.com/cd/0/get/DMD7tdDJKV-h95gHKamJfNe_XwVZx1FLmfMFLgzNZ_iwGHeK7oO0sSsZp8U2Peet2pZ-WVNoKmzwgHz4i-frTJi3ZPC7hLhUcWUikZ17qi3WASzD-V6DXXnZ8QKt5W7rpJGxD0It76WLeobOphU0GqU3gTlZSHsVdi_xIHCCNhXYzA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          echo "::add-mask::${DOWNLOAD_URL}"
          curl --fail --silent --show-error --location --max-time 120 "${DOWNLOAD_URL}" -o /tmp/secret-santa.zip
          unzip -tqq /tmp/secret-santa.zip
          mkdir -p public/randomizers/secret-santa
          for idx in 01 02 03 04 05 06 07 08 09 10; do
            file="$(unzip -Z -1 /tmp/secret-santa.zip | grep "^${idx}-.*\.webp$" | head -1)"
            test -n "$file"
            unzip -p /tmp/secret-santa.zip "$file" > "public/randomizers/secret-santa/$file"
            test -s "public/randomizers/secret-santa/$file"
          done
          test "$(find public/randomizers/secret-santa -name '*.webp' | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/randomizers/secret-santa
          git commit -m "Import ten Rosie Secret Santa WebP assets from approved Dropbox handoff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
