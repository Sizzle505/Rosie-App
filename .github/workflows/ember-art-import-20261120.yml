name: Ember Art Import - temporary transfer
on:
  push:
    branches:
      - work/ember-destructible-treasures-20261119
    paths:
      - .github/workflows/ember-art-import-20261120.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Retrieve generated art from Dropbox
        shell: bash
        env:
          ART_SOURCE: "https://uc08b13d8e8a845ac467ebe87915.dl.dropboxusercontent.com/cd/0/get/DMT_r5OBE3spbveDl306dYl9mSqA36s9zkqgl-sjWIRxviW3H43x4ZSSCdRLTBnANRSz9GbUJYNgDoAxKRTS1mldF3079aHCW5tx7Q6dSimeY1Ml90BrJclR9UbjfarAtHjrD56hjcCS6SaA6VsAGhiMuL9rkRH9nqInqkYbE0gAuA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          curl -fL --silent --show-error --max-time 180 "$ART_SOURCE" -o /tmp/ember-art.zip
          test "$(stat -c%s /tmp/ember-art.zip)" -gt 10000000
          unzip -q /tmp/ember-art.zip -d /tmp/ember-art-source
          test -f "/tmp/ember-art-source/Ember Tunnel Art Integration Pack/art-manifest.json"
      - name: Import and validate 10 optimized files
        run: |
          node scripts/import-ember-expansion.mjs "/tmp/ember-art-source/Ember Tunnel Art Integration Pack"
          node --input-type=module -e '
          import fs from "node:fs";
          import {EMBER_EXPANSION_ATLASES,EMBER_EXPANSION_TRANSITIONS} from "./src/emberExpansionCatalog.js";
          const root="public/ember-drill/expansion-batch-c/";
          const files=[...Object.values(EMBER_EXPANSION_ATLASES).map(a=>a.file),...Object.values(EMBER_EXPANSION_TRANSITIONS)];
          if(files.length!==10)throw Error("Expected exactly ten optimized art files");
          for(const f of files){
            const b=fs.readFileSync(root+f);
            if(b.length<4000||b.toString("ascii",0,4)!=="RIFF"||b.toString("ascii",8,12)!=="WEBP")throw Error("Bad atlas: "+f);
          }
          console.log("Imported "+files.length+" production-path preview artwork files");
          '
      - name: Commit art to isolated review branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/ember-drill/expansion-batch-c
          git diff --cached --quiet && exit 0
          git commit -m "Import ten optimized Ember Tunnel review atlases and transitions"
          git push origin HEAD:work/ember-destructible-treasures-20261119
