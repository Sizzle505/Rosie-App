name: Check Rosie Secret Santa
on:
  push:
    branches: [feature/rosie-santa-inline-20261116]
  pull_request:
    paths:
      - 'api/secret-santa.js'
      - 'api/_lib/secretSantaDraw.js'
      - 'src/RosieSecretSanta.*'
      - 'src/RosieRandomizers.jsx'
      - 'tests/secret-santa*.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/secret-santa*.test.mjs
      - run: npm run build
