name: Check Rosie Secret Santa
on:
  push:
    branches: [feature/rosie-santa-inline-20261116]
  pull_request:
    paths:
      - 'api/secret-santa.js'
      - 'api/_lib/secretSantaDraw.js'
      - 'src/RosieSecretSanta.*'
      - 'src/RosieRandomizers.jsx'
      - 'tests/secret-santa*.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/secret-santa*.test.mjs
      - run: npm run build

  browser-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check desktop, tablet and mobile Secret Santa layout
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rosie-vite.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node scripts/verify-secret-santa-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secret-santa-responsive
          path: artifacts/secret-santa/
          retention-days: 7
          if-no-files-found: warn
