name: Rosie Zen iPhone polish QA
on:
  pull_request:
    paths:
      - "src/RosieZenMeditation.jsx"
      - "src/RosieZenAmbient.jsx"
      - "src/RosieZenNov22Polish.css"
      - "src/RosieHaikuGarden.jsx"
      - "tests/rosie-zen-polish-visual.mjs"
      - ".github/workflows/rosie-zen-polish-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zen-iphone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/zen-polish.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zen-polish.log
          exit 1
      - name: Test desktop-safe mobile composition and reward screen
        run: node tests/rosie-zen-polish-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosie-zen-polish-iphone-screenshots
          path: artifacts/rosie-zen-polish/
          retention-days: 14
