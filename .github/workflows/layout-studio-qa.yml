name: Secret Layout Studio safeguards
on:
  push:
    paths:
      - 'src/SecretLayoutStudio.*'
      - 'src/layoutStudioScope.js'
      - 'src/layoutStudioGeometry.js'
      - 'src/layoutStudioGeometry.test.js'
      - 'src/layoutStudioScope.test.js'
      - 'src/layoutTargets.js'
      - 'api/layout-presets.js'
      - 'src/main.jsx'
      - '.github/workflows/layout-studio-qa.yml'
  pull_request:
    paths:
      - 'src/SecretLayoutStudio.*'
      - 'src/layoutStudioScope.js'
      - 'src/layoutStudioScope.test.js'
      - 'src/layoutTargets.js'
      - 'api/layout-presets.js'
      - 'src/main.jsx'
      - '.github/workflows/layout-studio-qa.yml'
jobs:
  layout-studio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/layoutStudioScope.test.js src/layoutStudioGeometry.test.js
      - run: npm run build
