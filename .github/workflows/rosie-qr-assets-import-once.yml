name: Import approved Rosie QR Atelier art
on:
  push:
    paths:
      - '.github/workflows/rosie-qr-assets-import-once.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Import approved art pack from connected Dropbox transfer
        env:
          ROSIE_ASSETS_URL: 'https://ucc47e9b442fd1852d057d870edd.dl.dropboxusercontent.com/cd/0/get/DMPhWwPSrOoK3t5u9TT-1DKyYf4xnOxK0ByX3e6Zi4Iw-Ulh_Q8Vf0YEvmsS3PWghz_Di1otSojzBKZptLYzXt2Z1HUe0ANIfR3mz_NJBf1h5INj1WBwuTr1FtITS_Rwk1P1hgA0ySoRvf2k0APD1S_LL0bEgv0c4dwhnNkZKwdSMQ/file?c_luid=667ded1d'
        run: |
          set -euo pipefail
          mkdir -p public/qr-atelier/rosie-qr
          curl --fail --location --silent --show-error --max-time 90 "$ROSIE_ASSETS_URL" --output /tmp/rosie-qr-assets.zip
          unzip -q -o /tmp/rosie-qr-assets.zip -d public/qr-atelier/rosie-qr
          test -s public/qr-atelier/rosie-qr/rosie-frame-seated.webp
          test -s public/qr-atelier/rosie-qr/rosie-frame-presenting.webp
          test -s public/qr-atelier/rosie-qr/rosie-frame-peeking.webp
          test -s public/qr-atelier/rosie-qr/rosie-frame-blank.webp
          test -s public/qr-atelier/rosie-qr/rosie-popup-desktop.webp
          test -s public/qr-atelier/rosie-qr/rosie-popup-ipad.webp
          test -s public/qr-atelier/rosie-qr/rosie-popup-iphone.webp
          git config user.name "Rosie QR Asset Integration"
          git config user.email "actions@users.noreply.github.com"
          git add public/qr-atelier/rosie-qr
          if ! git diff --cached --quiet; then
            git commit -m "Import approved Rosie QR frames and device backgrounds"
            git push origin HEAD:main
          fi
