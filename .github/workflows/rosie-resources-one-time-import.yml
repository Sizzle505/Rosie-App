name: Import Rosie Resources image assets from Dropbox
on:
  push:
    branches:
      - work/rosie-resources-integrated-20261011
    paths:
      - '.github/workflows/rosie-resources-one-time-import.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved assets from temporary Dropbox transfer links
        env:
          BG_URL: "https://uc7bdea5cb4c08e25326a847dd0a.dl.dropboxusercontent.com/cd/0/get/DJ3cM0YINo-x8_iv5fWgYmL3BgzmQJClki1qhyymiH992NBxMhR1UzT0mvv4q1NrxgMGkdyAOpQRK3l11QQ94Qs5YuC7GPgkSbBSECK4QexUhl1u7CUNTSWKsuEW68Q-CUTRuXBzTMNxmrEG4anGP-nZXFn4AJZuys3FfXfHgIyQ8w/file?c_luid=667ded1d"
          CREST_URL: "https://uc62b72ba1ed94cad4b49d99c1ab.dl.dropboxusercontent.com/cd/0/get/DJ2cvOb512nKWgCrhrArR9uo4e0Osjn07C-lLBP37bj-NzftMRr2HmKcDuxEtHcK6q0HUeabcI-ONydzZwrls_TdG4p3IsZrNck1IIxUcZ4x8jZGTeC-JE_73sYwE3MSEh9xF8cH9f3jCys9-lNiy4S3jyCLVJkPQEd4Pb_7jbMyeA/file?c_luid=667ded1d"
          REMINDERS_URL: "https://uccd1422db7f0e755a72900d2c60.dl.dropboxusercontent.com/cd/0/get/DJ3jEp3lXhsKOJmOInThfpIJ0RR1-fkgR30T3rxCJFPKM2njdl8jj-7YotslDy6UdwlaOlaJ5pjUcFV3Mtt6scWdE0M19IKNrpe_xUA3Rcu_nOlxK7FfIHUYnC4fqkC0G2SY9OdudwyPK8IeHPxe1-pIy6dz_8Wfo46gBxlPD_Ferg/file?c_luid=667ded1d"
          TIMEKEEPER_URL: "https://uccda5569b444efb42051476f572.dl.dropboxusercontent.com/cd/0/get/DJ0YJ1DaPCLEZYeF_1ZW_h6W4v78mybr_qPZrCMmxMYoj_dY5dx5bbvGAd4d7no7FlnI9a2V3w8sqGrrKJBI7Rlll3TCdO5RcCKrP9zPqpbz4lKUtttnKdNBOZygC24bLVPtQn9pv2lKKRRsChM2a7Kucj0mV34XTO5SwlV8sAerQQ/file?c_luid=667ded1d"
          CALCULATIONS_URL: "https://uce3ea8cd50c145259f2e70d7f48.dl.dropboxusercontent.com/cd/0/get/DJ1ZquYuW0W7hVeb_ONQM-LYSoydk4oUvJEQ4SBC-LvWRVhyHMHhsAMa412DORwJT17qZUhNxZ3ZOuR9UGSBusdGq5SPPjndf2tMG_g4CbORBROdSocfKH8pdYZf3ShwNVleiM04KB0wQV9KV5pwNIZsfvxr4BeMOoXO9GWsJacQUw/file?c_luid=667ded1d"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rosie-resource-transfer public/rosieverse/resources
          curl -fsSL --max-time 120 "$BG_URL" -o /tmp/rosie-resource-transfer/observatory.png
          curl -fsSL --max-time 120 "$CREST_URL" -o /tmp/rosie-resource-transfer/crest.png
          curl -fsSL --max-time 120 "$REMINDERS_URL" -o /tmp/rosie-resource-transfer/reminders.png
          curl -fsSL --max-time 120 "$TIMEKEEPER_URL" -o /tmp/rosie-resource-transfer/timekeeper.png
          curl -fsSL --max-time 120 "$CALCULATIONS_URL" -o /tmp/rosie-resource-transfer/calculations.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("/tmp/rosie-resource-transfer")
          dest = Path("public/rosieverse/resources")
          sizes = {
              "observatory": (863, 1822),
              "crest": (1536, 1024),
              "reminders": (2172, 724),
              "timekeeper": (2172, 724),
              "calculations": (2172, 724),
          }
          for name, expected in sizes.items():
              with Image.open(source / (name + ".png")) as im:
                  if im.size != expected:
                      raise RuntimeError(f"{name}: expected {expected}, got {im.size}")
                  im.load()
                  im = im.convert("RGB" if name == "observatory" else "RGBA")
                  im.save(dest / (name + ".webp"), "WEBP", quality=91, method=6)
                  print(name, "verified", expected, (dest / (name + ".webp")).stat().st_size, "bytes")
          PY
      - name: Commit verified images and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rosie-App Asset Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/resources/*.webp
          git rm .github/workflows/rosie-resources-one-time-import.yml
          git commit -m "Install approved Rosie Resources observatory and navigation art"
          git push
