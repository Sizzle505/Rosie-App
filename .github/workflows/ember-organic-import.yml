name: Refresh continuous painted-earth siding and backgrounds (one-time)
on:
  push:
    branches: ["work/ember-drill-barkroot-ruby-milestone"]
    paths: [".github/workflows/ember-organic-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "work/ember-drill-barkroot-ruby-milestone"
          persist-credentials: true
      - name: Validate and copy organic materials and new cave backgrounds
        env:
          SOURCE_ZIP_URL: 'https://ucfe9f0b07c21346f95782d71f2f.dl.dropboxusercontent.com/cd/0/get/DJ-I7OMJy2d8FCiI6ZtGmh6ezhzNsl9bGq3qHoFlOI7km7KdWI3ofu84dr2HNOTQTaTj7mEEX0RdCimGMpS3mDimcJUDEONVzxdFuvT7Jq3xF2OkCm-HW7MroX1_0sjHUO3kbdDQ4e--Tmy4wsRf3Iwa-5uGyHwgnYDa9HTJlf2l7Q/file?c_luid=667ded1d'
        shell: bash
        run: |
          python - <<'PY'
          import zipfile,urllib.request,os,io
          from pathlib import Path
          req=urllib.request.Request(os.environ["SOURCE_ZIP_URL"],headers={"User-Agent":"RosieApp-AssetImporter"})
          with urllib.request.urlopen(req,timeout=80) as response:raw=response.read()
          dest=Path("public/ember-drill");dest.mkdir(exist_ok=True,parents=True)
          names={"barkroot-earth.webp":"terrain-barkroot-earth.webp",
                 "deep-rootstone.webp":"terrain-deep-rootstone.webp",
                 "ruby-crystal-rock.webp":"terrain-ruby-crystal-rock.webp",
                 "temple-basalt.webp":"terrain-temple-basalt.webp",
                 "ruby-organic-passage.webp":"ruby-organic-passage.webp",
                 "temple-organic-passage.webp":"temple-organic-passage.webp"}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for src,dst in names.items():
                  data=z.read(src)
                  assert data[:4]==b"RIFF" and len(data)<480000
                  (dest/dst).write_bytes(data)
                  print(dst,len(data))
          PY
      - name: Commit validated assets
        run: |
          git config user.name "rosie-art-importer[bot]"
          git config user.email "rosie-art-importer@users.noreply.github.com"
          git add public/ember-drill/terrain-*.webp public/ember-drill/*organic-passage.webp
          git diff --cached --quiet || git commit -m "Use organic continuous rock material and rail-free temple panoramas"
          git push origin HEAD:work/ember-drill-barkroot-ruby-milestone
