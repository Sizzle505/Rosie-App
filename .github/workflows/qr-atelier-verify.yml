name: QR Atelier checks
on:
  push:
    branches:
      - work/qr-atelier-foundation-20261012
  pull_request:
    paths:
      - 'src/RosieQrAtelier*'
      - 'src/qrAtelierLogic*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run QR payload unit tests
        run: node --test src/qrAtelierLogic.test.js
      - name: Check production build
        run: npm run build
