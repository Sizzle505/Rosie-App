name: RosieVerse trim and visual regression check
on:
  push:
    branches: [work/rosieverse-tight-button-frames-20261009]
    paths: [.github/workflows/rosieverse-trim-qa.yml]
permissions:
  contents: write
jobs:
  trim-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare asset processor
        run: python3 -m pip install --quiet pillow numpy opencv-python-headless
      - name: Regenerate precisely cropped, transparent card artwork
        run: python3 scripts/build_rosieverse_buttons.py
      - name: Browser dependencies and production build
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
          npm run build
      - name: Run local site
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/rosieverse-trim-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
      - name: Screenshot and verify after splash for iPhone and desktop
        run: |
          node --input-type=module <<'JS'
          import { chromium, webkit } from 'playwright';
          import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('rosieverse-trim-qa',{recursive:true});
          const report={ref:process.env.GITHUB_SHA,tests:[],errors:[]};
          const sizes=[[390,844],[375,667],[320,650],[768,1024],[1440,900]];
          for(const [engineName,browserType] of [['webkit',webkit],['chromium',chromium]]){
            const browser=await browserType.launch({headless:true});
            for(const [w,h] of sizes){
              const context=await browser.newContext({viewport:{width:w,height:h},isMobile:w<=390,hasTouch:w<=390});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'networkidle'});
              await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
              await page.locator('nav[aria-label="RosieVerse destinations"] button').first().waitFor();
              const metrics=await page.evaluate(async()=>{
                const buttons=[...document.querySelectorAll('nav[aria-label="RosieVerse destinations"] button')];
                const rects=buttons.map(b=>{const r=b.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),bottom:Math.round(r.bottom)}});
                const images=[];
                for(const b of buttons){
                  const img=b.querySelector('img');
                  await img.decode();
                  const c=document.createElement('canvas');c.width=c.height=1;
                  const ctx=c.getContext('2d');
                  ctx.drawImage(img,0,0,1,1,0,0,1,1);
                  images.push({src:img.getAttribute('src'),width:img.naturalWidth,height:img.naturalHeight,cornerAlpha:ctx.getImageData(0,0,1,1).data[3]});
                }
                return {viewportWidth:innerWidth,docWidth:document.documentElement.scrollWidth,docHeight:document.documentElement.scrollHeight,rects,images,rowGap:Math.round(rects[2].y-rects[0].bottom)};
              });
              if(metrics.docWidth>w+1)report.errors.push(`${engineName} ${w}: horizontal overflow ${metrics.docWidth}`);
              if(metrics.rects.length!==5 || metrics.images.length!==5)report.errors.push(`${engineName} ${w}: missing buttons`);
              if(metrics.rowGap>5 || metrics.rowGap < -22)report.errors.push(`${engineName} ${w}: undesired row gap/overlap ${metrics.rowGap}`);
              if(metrics.images.some(i=>i.cornerAlpha>32||i.width<=0))report.errors.push(`${engineName} ${w}: source art corners not transparent`);
              if(metrics.rects.some(r=>r.w<65||r.h<65))report.errors.push(`${engineName} ${w}: button tap target too small`);
              if(pageErrors.length)report.errors.push(`${engineName} ${w}: runtime errors ${pageErrors.join(';')}`);
              if(w===390||w===1440)await page.screenshot({path:`rosieverse-trim-qa/${engineName}-${w}x${h}.png`,fullPage:true,animations:'disabled'});
              if(w===390){
                for(const [id,name] of [['fortune','Fortune Teller'],['cheese','Cheese Board Exam'],['captain','Captain Rosie'],['vault','Card Vault'],['randomizers','Randomizers']]){
                  await page.getByRole('button',{name:'Open '+name}).click();
                  if(!page.url().endsWith('#'+id))report.errors.push(`${engineName}: link ${id} failed`);
                  await page.goto('http://127.0.0.1:4173/#home');
                  await page.locator('.loading-screen').waitFor({state:'hidden',timeout:12000});
                }
              }
              report.tests.push({engine:engineName,viewport:[w,h],...metrics});
              await context.close();
            }
            await browser.close();
          }
          writeFileSync('rosieverse-trim-qa/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({count:report.tests.length,errors:report.errors,rowGaps:report.tests.map(t=>({engine:t.engine,size:t.viewport,gap:t.rowGap}))},null,2));
          if(report.errors.length)process.exitCode=1;
          JS
      - name: Save assets and QA captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/buttons rosieverse-trim-qa
          git diff --cached --quiet || git commit -m "Regenerate cropped button art and record visual QA [skip ci]"
          git push origin HEAD:refs/heads/work/rosieverse-tight-button-frames-20261009
