name: Import approved Tunnel Drill opening media
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-tunnel-cinematic.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and verify approved 47.92s MP4
        env:
          CINEMATIC_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/507123b0-2aa6-490f-92b5-04ba606bd6c2.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzRiNzUxMzA4MmNjZDcwMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTU2NjEyOH0.JDVIB6Em3Kif-nANTBhbR69XK8j0mJosSVh222euyek"
        run: |
          set -euo pipefail
          mkdir -p public/ember-drill
          curl --fail --location --retry 3 --max-time 240 "$CINEMATIC_URL" --output public/ember-drill/rosie-tunnel-opening.mp4
          echo "bfeaf6b48ece51b27dbe106d337ba1b2678b31ce6d500dc4bce380e7c23b60d4  public/ember-drill/rosie-tunnel-opening.mp4" | sha256sum -c -
          test "$(stat -c %s public/ember-drill/rosie-tunnel-opening.mp4)" -gt 10000000
          ffprobe -v error -show_entries format=duration:stream=codec_name -of default=nw=1 public/ember-drill/rosie-tunnel-opening.mp4
      - name: Commit permanent video into game assets
        run: |
          set -euo pipefail
          git config user.name "Rosie Game Assets"
          git config user.email "actions@users.noreply.github.com"
          git add public/ember-drill/rosie-tunnel-opening.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add narrated-free Tunnel opening with original Kingdom Awakens soundtrack"
            git push origin HEAD:main
          fi
