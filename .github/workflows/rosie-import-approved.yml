name: Import approved Rosie cards
on:
  push:
    branches:
      - work/rosie-approved-108-20261024
    paths:
      - .github/workflows/rosie-import-approved.yml
permissions:
  contents: write
jobs:
  import-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Rosie App
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Download approved Dropbox archive
        env:
          ROSIE_ARCHIVE_URL: 'https://uc14a40e283bcb64499763ecd500.dl.dropboxusercontent.com/cd/0/get/DKkjYWyL2ZL1B4myjCqk0BRgKbcsq5zF8KmJkOX3O7eGJ60m8Z9ReAhgkoKwJ5N7IQ5iKw-68EQ_hBO1nNIhaVh3-6BU6Bs51acU4bMUcRkDtp9f_gFnfpMzYUh2z8YsqyzmfXweQu9Tz7BpIlNneojYjs0tad13QCX95zsz2I_wIQ/file?c_luid=667ded1d'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ROSIE_ARCHIVE_URL" --output /tmp/rosie-approved.zip
          echo "09a75122165c387836bb6ffcf807bb13cb5b28522512b3d58a6fffd9dc2c96cb  /tmp/rosie-approved.zip" | sha256sum --check
          mkdir -p /tmp/rosie-approval
          unzip -q /tmp/rosie-approved.zip -d /tmp/rosie-approval
      - name: Verify assets and extend card manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const folder = '/tmp/rosie-approval';
          const source = fs.readFileSync('src/rosieCards.js', 'utf8');
          const records = JSON.parse(fs.readFileSync(path.join(folder,'cards-approved-manifest.json'),'utf8'));
          const ready = records.filter(r => r.status === 'ready');
          const reserved = records.filter(r => r.status !== 'ready');
          if(records.length !== 108 || ready.length !== 107 || reserved.length !== 1 || reserved[0].id !== 'rc-195') throw Error('Unexpected batch counts');
          const ids = new Set(); let n = 153;
          for(const row of records) {
            if(row.id !== 'rc-' + String(n++).padStart(3,'0')) throw Error('Numbering mismatch '+row.id);
            if(ids.has(row.id) || source.includes('"id": "'+row.id+'"')) throw Error('Duplicate id '+row.id);
            ids.add(row.id);
          }
          fs.mkdirSync('public/card-vault',{recursive:true});
          for(const row of ready) {
            const original = path.join(folder,'public/card-vault',row.filename);
            const target = path.join('public/card-vault',row.filename);
            if(fs.existsSync(target)) throw Error('Would overwrite '+target);
            const bytes = fs.readFileSync(original);
            if(bytes.length < 30000 || bytes.toString('ascii',0,4)!=='RIFF' || bytes.toString('ascii',8,12)!=='WEBP') throw Error('Bad image '+row.filename);
            fs.copyFileSync(original,target);
          }
          const insertion = fs.readFileSync(path.join(folder,'approved-cards.js'),'utf8').trim();
          const anchor = '\n];\n\nexport default rosieCards;';
          if(!source.includes(anchor)) throw Error('Manifest format changed; abort safely');
          fs.writeFileSync('src/rosieCards.js',source.replace(anchor,',\n'+insertion+'\n];\n\nexport default rosieCards;'));
          if(!fs.readFileSync('src/rosieCards.js','utf8').includes('"id": "rc-260"')) throw Error('Final id missing');
          console.log('Prepared 107 cards, rc-153 through rc-260 with rc-195 held');
          NODE
      - name: Build validation
        run: |
          npm ci
          npm run build
      - name: Commit approved batch to review branch
        run: |
          set -euo pipefail
          git config user.name "Rosie Card Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rosieCards.js public/card-vault/
          git rm -- .github/workflows/rosie-import-approved.yml
          git diff --cached --check
          git commit -m "Import 107 approved Rosie cards, reserve rc-195"
          git push origin HEAD
