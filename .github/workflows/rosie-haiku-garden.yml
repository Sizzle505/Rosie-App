name: Rosie Haiku Garden QA
on:
  pull_request:
    paths:
      - "src/haikuEngine.js"
      - "src/RosieHaikuGarden.jsx"
      - "src/RosieHaikuScene.jsx"
      - "src/RosieHaikuScene.css"
      - "public/rosieverse/haiku/**"
      - "src/RosieHaikuGarden.css"
      - "src/RosieHome.jsx"
      - "src/RosieHome.module.css"
      - "src/main.jsx"
      - "tests/haikuGarden.test.mjs"
      - ".github/workflows/rosie-haiku-garden.yml"
  workflow_dispatch:
jobs:
  haiku:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/haikuGarden.test.mjs
      - run: npm run build
