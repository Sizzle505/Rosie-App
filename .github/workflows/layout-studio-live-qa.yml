name: Layout Studio live API smoke
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/layout-studio-live-qa.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check Oracle unlock, cross-page save, and exact-screen isolation
        env:
          BASE_URL: https://rosie-app-qvlffxa6c-apex-7488.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = process.env.BASE_URL;
          const firstKey = 'window:9999x9999@9';
          const otherKey = 'window:9998x9999@9';
          const request = async (path, payload, cookie) => {
            const response = await fetch(base + path, payload ? {
              method: 'POST',
              headers: { 'content-type': 'application/json', ...(cookie ? { cookie } : {}) },
              body: JSON.stringify(payload),
              redirect: 'error'
            } : { redirect: 'error' });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error('Non-JSON reply (' + response.status + '): ' + text.slice(0,120)); }
            if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + JSON.stringify(data));
            return { response, data };
          };
          const {response: unlocked, data: unlockedData} = await request('/api/layout-presets', { action: 'unlock', phrase: 'manchego' });
          assert.equal(unlockedData.unlocked,true);
          const cookie = unlocked.headers.get('set-cookie')?.split(';')[0];
          assert.ok(cookie?.startsWith('rosie_layout_editor='),'Missing secure unlock cookie');
          const layout = {
            haiku: { rosie: { x: 34, y: -22, scale: 1.2 } },
            fortune: { machine: { x: 9, y: 2, scale: 1 } }
          };
          const {data: saved} = await request('/api/layout-presets', { action:'save', screenKey:firstKey, layouts:layout }, cookie);
          assert.equal(saved.saved,true);
          assert.equal(saved.screenKey,firstKey);
          const {data: retrieved} = await request('/api/layout-presets?screenKey=' + encodeURIComponent(firstKey));
          assert.deepEqual(retrieved.layouts,layout);
          const {data: isolated} = await request('/api/layout-presets?screenKey=' + encodeURIComponent(otherKey));
          assert.deepEqual(isolated.layouts,{});
          console.log('PASS: Oracle unlock, signed cookie, single cross-page publish, exact-screen isolation.');
          NODE
