name: Import optimized Captain Rosie ship sprite
on:
  push:
    branches: ["work/captain-painted-sailing-ship-20261010"]
    paths: [".github/workflows/captain-ship-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/captain-painted-sailing-ship-20261010
          persist-credentials: true
      - name: Import and verify generated transparent WebP
        env:
          ASSET_URL: "https://ucd6070cdd22d4255885e94ef09a.dl.dropboxusercontent.com/cd/0/get/DJvpdPke4U5hr2vAeHH74v1tQECOZYEhvcr4TMJ6avEHfOuAdBcSKZldJUDx_UeZVU9mtoW2TCjR9YLHVTRL-gv8RHjpSEDYx2sp5wcp9S_kkyQfNWFWMuH3jV2auVcDhmvGGu60q3usZyBgG2IsVwj_JNnj2irNpKQ9y0Fj85VLRA/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 "$ASSET_URL" -o public/captain-rosie-ship.webp
          echo "2a64bea3a343b754aa34dae3b05b10ce7a20d830b96be5f22b498337451d8835  public/captain-rosie-ship.webp" | sha256sum --check
          test "$(stat -c %s public/captain-rosie-ship.webp)" -lt 200000
      - name: Commit game artwork
        run: |
          git config user.name "Rosie App Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git add public/captain-rosie-ship.webp
          git commit -m "Import painted Rosie Japanese sailing ship asset [skip ci]"
          git push origin HEAD:work/captain-painted-sailing-ship-20261010
