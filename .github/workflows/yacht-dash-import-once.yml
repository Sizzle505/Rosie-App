name: Yacht Dash - one-time approved art import
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/yacht-dash-import-once.yml
permissions:
  contents: write
jobs:
  import-art:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yacht-dash-four-chapters-20261119
          persist-credentials: true
      - name: Download short-lived Dropbox asset package
        env:
          ASSET_URL: "https://ucce15166152e54b2294b3849d8a.dl.dropboxusercontent.com/cd/0/get/DMT3ydOTKMQElHAMYpgQxOIxoDNpE8a0QT2IMvMHKJcLT0oeaOzN1NA5GsUF4o9sp55Z2vDhLFN1DmbdSBKrOVs1VeFdamT4hZCOHM2M3ta3xkZl1ilwh_ujhuKfW1XlqQogFBL2b2BDRdMbm752saC_-nVqXUYaY5yzcWeFIU34WA/file?c_luid=667ded1d"
        run: |
          curl --fail --location --silent --show-error --max-time 120 "$ASSET_URL" --output /tmp/yacht-approved.zip
          test "$(stat -c %s /tmp/yacht-approved.zip)" -gt 9000000
      - name: Validate approved WebP files and unpack into public/yacht-dash
        run: |
          python - <<'PY'
          import zipfile, json, hashlib, pathlib, sys
          z=zipfile.ZipFile('/tmp/yacht-approved.zip')
          manifest=json.loads(z.read('asset-manifest.json'))
          names={a['file'].lstrip('/') for a in manifest['assets']}
          valid=0; zero=0
          for name in sorted(names):
              if name.startswith('yacht-dash/'):
                  name='public/'+name
              if name not in z.namelist() or not name.startswith('public/yacht-dash/') or not name.endswith('.webp'):
                  raise RuntimeError('Unexpected missing or unsafe path: '+name)
              data=z.read(name)
              entry=next(a for a in manifest['assets'] if 'public'+a['file']==name)
              if not data:
                  zero+=1
                  print('WARN: empty upstream asset omitted: '+name)
                  continue
              if len(data)!=entry['size'] or hashlib.sha256(data).hexdigest()!=entry['sha256']:
                  raise RuntimeError('Integrity error: '+name)
              if not data.startswith(b'RIFF') or data[8:12]!=b'WEBP':
                  raise RuntimeError('Bad WebP: '+name)
              dest=pathlib.Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              valid+=1
          print('Imported verified assets:',valid,'Skipped invalid:',zero)
          if valid != 38 or zero != 1:
              raise RuntimeError('Unexpected package contents')
          PY
      - name: Restore and verify fishing skiff from approved transparent PNG master
        env:
          SKIFF_URL: "https://ucff82887bc11220974322b525ce.dl.dropboxusercontent.com/cd/0/get/DMT4HQ4tfKgwwpVqRWXlHepEFDwkZXk5ah1t7TM6MEGlwnrGpQi8BDZXdrOzRnpXvM4_M-7gSGvc9CneaFLlXE-fZe0T8Feeu6vJVPfP0k-gu5sGFIlUavXLTVb8JTHQ4O6wgn2x8Bkl5W6zTVZ4YmUqWiWQgHSB3VLbLJVOim8h7g/file?c_luid=667ded1d"
        run: |
          curl --fail --location --silent --show-error --max-time 90 "$SKIFF_URL" --output /tmp/approved-skiff.png
          python -m pip -q install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          import pathlib, zipfile, json, hashlib
          source=Image.open("/tmp/approved-skiff.png").convert("RGBA")
          if source.width < 700 or source.height < 700:
              raise ValueError("Fishing skiff master is too small")
          source.thumbnail((700,700), Image.Resampling.LANCZOS)
          target=pathlib.Path("public/yacht-dash/obstacles/fishing-skiff.webp")
          target.parent.mkdir(parents=True,exist_ok=True)
          source.save(target, "WEBP", quality=88, method=6)
          if target.stat().st_size < 10000:
              raise RuntimeError("Fishing skiff output missing or unexpectedly small")
          with zipfile.ZipFile("/tmp/yacht-approved.zip") as archive:
              manifest=json.loads(archive.read("asset-manifest.json"))
          asset=next(a for a in manifest["assets"] if a["file"].endswith("/fishing-skiff.webp"))
          data=target.read_bytes()
          asset["size"]=len(data)
          asset["sha256"]=hashlib.sha256(data).hexdigest()
          asset["source"]="wrecked_japanese_fishing_skiff.png"
          manifest["packagingFix"]="Recovered originally empty fishing-skiff.webp from its approved transparent PNG master"
          pathlib.Path("public/yacht-dash/asset-manifest.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          print("Recovered fishing skiff",target.stat().st_size,"bytes")
          PY
      - name: Commit approved art to feature branch
        run: |
          git config user.name "Rosie Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git add public/yacht-dash/
          git diff --cached --quiet && exit 1
          git commit -m "Import 38 approved Yacht Dash WebP assets from Dropbox [skip ci]"
          git push origin HEAD:feature/yacht-dash-four-chapters-20261119
