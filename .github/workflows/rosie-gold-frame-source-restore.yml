name: Restore Approved Golden Device Without Dark-Pixel Damage
on:
  push:
    paths:
      - '.github/workflows/rosie-gold-frame-source-restore.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/work/calculations-mythic-functional-devices-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve corrected authentic gold slices
        env:
          ROSIE_ART_ARCHIVE: "https://ucc0c7fae51e72786398505991d4.dl.dropboxusercontent.com/cd/0/get/DJ2a-z9vaA7jdqvEWaoadJ1rUJrmReqeuCyMpe-txYx28miMzA7W4gK-6brcxN2Iro8IaeKx1durMEyPPNvbfzAnpuPf1J1LY6hgvVD436cP47GvzKQwp87dwnkY8xZpCCiyloqXHZY5ch5mLMO6af4MPetU1IgoTInp12YCZ-FPkg/file?c_luid=667ded1d"
        run: |
          curl -fLsS --retry 2 "$ROSIE_ART_ARCHIVE" -o /tmp/rosie-faithful-gold.zip
          echo '9c44d16d0b326b51e03cb84d34a51d47b736ee8c6eada3f3b3b3c0b0f122552e  /tmp/rosie-faithful-gold.zip' | sha256sum --check
          unzip -o /tmp/rosie-faithful-gold.zip -d public/rosieverse/calculations/toolkit
          echo 'dd92d9e191f6e6ec0e4c15f57715743d56193d351c90c2b100a6b62cdd1760b9  public/rosieverse/calculations/toolkit/gold-device.webp' | sha256sum --check
      - name: Commit verified lossless assets without overwriting concurrent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rosieverse/calculations/toolkit
          git commit -m "Restore authentic gold frame and dark shadows from approved source" || exit 0
          git fetch origin work/calculations-mythic-functional-devices-20261011
          git rebase origin/work/calculations-mythic-functional-devices-20261011
          git push origin HEAD:work/calculations-mythic-functional-devices-20261011
