name: Timekeeper mobile visual verification
on:
  push:
    branches:
      - main
      - work/timekeeper-enamel-instruments-20261012
      - work/timekeepers-midnight-observatory
    paths:
      - src/RosieTimekeeper.jsx
      - src/RosieTimekeeper.css
      - src/TimekeeperClockwork.css
      - tests/timekeeper-iphone-visual.mjs
      - tests/timekeeper-observatory-visual.mjs
      - .github/workflows/timekeeper-iphone-visual.yml
  pull_request:
    paths:
      - src/RosieTimekeeper.jsx
      - src/RosieTimekeeper.css
      - tests/timekeeper-iphone-visual.mjs
      - tests/timekeeper-observatory-visual.mjs
permissions:
  contents: read
jobs:
  test-timekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rosie-vite.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rosie-vite.log
          exit 1
      - run: node tests/timekeeper-observatory-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timekeeper-observatory-screenshots
          path: artifacts/timekeeper-approved/
          retention-days: 14
