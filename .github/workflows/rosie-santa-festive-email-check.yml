name: Verify Rosie festive email previews
on:
  push:
    branches: [feature/rosie-santa-festive-emails]
    paths:
      - .github/workflows/rosie-santa-festive-email-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/secret-santa*.test.mjs
      - run: npm run build
      - name: Verify both public previews and image files
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from "node:fs";
          import assert from "node:assert/strict";
          const root="dist/randomizers/secret-santa/email/";
          const assets=["rosie-holiday-banner.jpg","invitation-scroll.png","sealed-envelope.png","rosie-crest.png"];
          for (const name of assets) assert.ok(existsSync(root+name),name+" is missing");
          for (const [kind,expected] of [["registration","on the list."],["draw","The names are drawn."]]) {
            const page=readFileSync(root+"preview-"+kind+".html","utf8");
            assert.ok(page.includes(expected),"preview headline missing");
            assert.ok(page.includes("DESIGN PREVIEW ONLY"));
            assert.ok(page.includes("email/rosie-holiday-banner.jpg"));
          }
          console.log("All festive email previews and art files are present in the production dist.");
          JS
