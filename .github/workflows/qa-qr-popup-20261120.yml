name: QR popup full-frame visual regression (temporary)
on:
  push:
    branches: [fix/qr-viewer-finish-title-close-20261120]
    paths:
      - src/RosieQrAtelier.jsx
      - src/rosie-qr-viewer.css
      - scripts/qa-qr-popup-20261120.mjs
      - .github/workflows/qa-qr-popup-20261120.yml
permissions:
  contents: read
jobs:
  check-qr-popup:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/rosie-qr-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rosie-qr-vite.log
          exit 1
      - run: node scripts/qa-qr-popup-20261120.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-qr-popup-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 2
