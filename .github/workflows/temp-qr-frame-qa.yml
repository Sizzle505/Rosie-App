name: Temporary final QR aperture QA
on:
  push:
    branches: [fix/qr-viewer-finish-title-close-20261120]
    paths:
      - src/RosieQrAtelier.jsx
      - src/rosie-qr-viewer.css
      - scripts/temp-qr-frame-qa.mjs
      - .github/workflows/temp-qr-frame-qa.yml
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/qr-vite.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node scripts/temp-qr-frame-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-qr-aperture-screenshots
          path: qa-screenshots/
          retention-days: 1
          if-no-files-found: ignore
