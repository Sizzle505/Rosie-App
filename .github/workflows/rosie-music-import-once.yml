        run: |
          set -euo pipefail
          python3 scripts/import_rosie_music.py
          test "$(find public/rosie-music -name '*.mp3' -type f | wc -l)" -eq 13
      - name: Commit only compact browser derivatives
        run: |
          set -euo pipefail
          git config user.name 'RosieVerse music import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rosie-music/
          git diff --cached --quiet && { echo 'No new audio to commit'; exit 1; }
          git commit -m 'Add 13 approved loop-prepared and level-matched RosieVerse music tracks'
          git push origin HEAD:release/20261120-rosieverse-original-soundtrack
