name: One-time import of 13 RosieVerse Suno recordings
on:
  push:
    branches: [release/20261120-rosieverse-original-soundtrack]
    paths: [.github/workflows/rosie-music-import-once.yml]
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install media encoder if absent
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
