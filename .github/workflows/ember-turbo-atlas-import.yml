name: Build real original Turbo animation atlas - one-time import
on:
  push:
    branches: ["work/ember-og-ribbon-prototype-20261014"]
    paths: [".github/workflows/ember-turbo-atlas-import.yml"]
permissions:
  contents: write
jobs:
  original-animated-webp-to-canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode all 10 frames of existing original animation
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python scripts/derive-ember-turbo-frames.py
      - name: Source and frame audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          root=Path('public/ember-drill')
          m=json.loads((root/'turbo-head-frames.json').read_text())
          assert m['sourceFrames']==10
          assert m['sourceSha256']=='95710297f70b74b18eade5e535146e710606c533b9566b364755a6f258db9868'
          p=root/m['sheet']
          assert p.stat().st_size>150000
          assert Image.open(p).size==(1540,252)
          print('verified 10 actual original animated Turbo frames in static Canvas atlas')
          PY
      - name: Permanently commit source-derived binary to feature branch only
        run: |
          git config user.name "Rosie OG Turbo Animation Forge"
          git config user.email "actions@users.noreply.github.com"
          git add public/ember-drill/turbo-head-frames.webp public/ember-drill/turbo-head-frames.json
          if ! git diff --cached --quiet; then
            git commit -m "Permanently integrate ten original animated Turbo frames as reproducible sprite atlas"
            git push origin HEAD:work/ember-og-ribbon-prototype-20261014
          fi
