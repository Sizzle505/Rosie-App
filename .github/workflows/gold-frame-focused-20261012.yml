name: Focused golden-frame verification
on:
  push:
    branches: [work/gold-constant-frame-satin-gleam-20261012]
    paths: [.github/workflows/gold-frame-focused-20261012.yml]
  # rerun after denser Split Bill spacing
jobs:
  fixed-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify seven identical gold tools and money formatting
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/gold-frame-vite.log 2>&1 &
          sleep 8
          node tests/calculations-toolkit-functional.mjs
