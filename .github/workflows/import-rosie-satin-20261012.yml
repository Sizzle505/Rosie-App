name: Import Rosie satin artwork once
on:
  push:
    branches:
      - work/calculations-satin-fullscreen-safe-tray-20261012
    paths:
      - .github/workflows/import-rosie-satin-20261012.yml
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calculations-satin-fullscreen-safe-tray-20261012
      - name: Import provided full-resolution burgundy satin image
        env:
          SATIN_FILE_URL: 'https://uc70a2c69c1e99f1d3173a63dc23.dl.dropboxusercontent.com/cd/0/get/DJ3FBhpc2aP9KYde-TC63wNUD_OUPZLqt2pfyeTPIFa5F_TZtNkTN-FTylABiNhcyonsrO7LccOeYLcPLZHxI9DiXpwF2VqtuaRK4po21ZWWBfQvPlbFAgQgH-k3V1xClqfEuoe5jwvyr8j4b_29bQd2O2RBhaKjfFeNIXfdSLllEA/file?c_luid=667ded1d'
        run: |
          set -euo pipefail
          mkdir -p public/rosieverse/calculations
          curl --fail --location --silent --show-error --max-time 180 "$SATIN_FILE_URL" -o public/rosieverse/calculations/burgundy-satin.png
          test "$(wc -c < public/rosieverse/calculations/burgundy-satin.png)" -ge 1000000
          file public/rosieverse/calculations/burgundy-satin.png
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/rosieverse/calculations/burgundy-satin.png
          git commit -m "Import original burgundy satin image for gold calculators"
          git push origin HEAD:work/calculations-satin-fullscreen-safe-tray-20261012
