name: Repair Approved Gold Instrument Image Fidelity
on:
  push:
    paths:
      - '.github/workflows/restore-golden-device-fidelity.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/work/calculations-mythic-functional-devices-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow numpy
      - name: Transfer original unmodified approved PNG
        env:
          APPROVED_DEVICE: "https://ucf38da5611ec26ac14c32c110d8.dl.dropboxusercontent.com/cd/0/get/DJ0R0veqwIvMiceCzdhpBwS_fdaK7mxxuFRnkoDzEDNXYf4yJlYA5dR4ncu8_HabMMnp2OXwR9YM33K0JYafapZmoIaZn9nZQxpl0boykZawDvghNygP8qxRz3VgJES55HoiIK_fZw1iIsd1zk6-RfhJ1iNC8D2poKHcaI_i_-XtNQ/file?c_luid=667ded1d"
        run: |
          curl -fLsS --retry 2 -o /tmp/rosie-approved-device.png "$APPROVED_DEVICE"
      - name: Lossless image components preserving full golden detail
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from pathlib import Path
          target=Path('public/rosieverse/calculations/toolkit')
          image=Image.open('/tmp/rosie-approved-device.png').convert('RGB')
          assert image.size==(1122,1402), image.size
          pixels=np.asarray(image).astype('int16')
          brightness=np.max(pixels,axis=2)
          alpha=np.clip((brightness-8)*255/32,0,255).astype('uint8')
          frame=image.convert('RGBA')
          frame.putalpha(Image.fromarray(alpha))
          frame=frame.crop(frame.getbbox())
          assert frame.size==(1122,1391),frame.size
          crops={
            'gold-device.webp':(0,0,1122,1391),
            'housing-top.webp':(0,0,1122,353),
            'housing-bottom.webp':(0,1034,1122,1391),
            'housing-center.webp':(180,318,942,1076),
            'housing-rail-left.webp':(0,345,190,520),
            'housing-rail-right.webp':(932,345,1122,520),
            'housing-cheese.webp':(0,553,210,772),
            'housing-shiba.webp':(912,553,1122,772)
          }
          for name,bounds in crops.items():
            piece=frame.crop(bounds)
            piece.save(target/name,'WEBP',lossless=True,method=6,exact=True)
            print(name,piece.size,(target/name).stat().st_size)
          PY
      - name: Commit restored original-quality assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/calculations/toolkit
          git commit -m "Restore lossless metallic gold instrument detail from approved original PNG" || exit 0
          git fetch origin work/calculations-mythic-functional-devices-20261011
          git rebase origin/work/calculations-mythic-functional-devices-20261011
          git push origin HEAD:work/calculations-mythic-functional-devices-20261011
