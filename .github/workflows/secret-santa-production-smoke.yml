name: Secret Santa live API smoke (one-time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/secret-santa-production-smoke.yml]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Create, draw and privately reveal a production test exchange
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const endpoint = "https://rosie-app-git.vercel.app/api/secret-santa";
          async function call(action, payload = {}) {
            const response = await fetch(endpoint, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action, ...payload })
            });
            const data = await response.json();
            return { status: response.status, data };
          }
          const title = "Rosie Secret Santa API Smoke " + process.env.GITHUB_SHA.slice(0, 12);
          const made = await call("create", { title,
            names: ["Live Smoke Alice", "Live Smoke Blake", "Live Smoke Casey", "Live Smoke Dylan"] });
          assert.equal(made.status, 201, "Create failed: " + JSON.stringify(made.data));
          const { exchange, hostToken, invitations } = made.data;
          assert.equal(exchange.participants.length, 4);
          assert.equal(Object.hasOwn(exchange, "budget"), false);
          assert.equal(Object.hasOwn(exchange, "date"), false);
          assert.equal(invitations.length, 4);
          assert.equal(Object.hasOwn(exchange, "assignments"), false);
          const organizer = await call("dashboard", { exchangeId: exchange.id, hostToken });
          assert.equal(organizer.status, 200);
          assert.equal(Object.hasOwn(organizer.data.exchange, "assignments"), false);
          const drawing = await call("draw", { exchangeId: exchange.id, hostToken });
          assert.equal(drawing.status, 200, "Draw failed: " + JSON.stringify(drawing.data));
          assert.equal(drawing.data.exchange.status, "drawn");
          const recipients = new Set();
          for (const person of invitations) {
            const response = await call("reveal", {
              exchangeId: exchange.id, guestId: person.id, guestToken: person.token
            });
            assert.equal(response.status, 200);
            assert.ok(response.data.recipient?.name);
            assert.notEqual(response.data.recipient.name, person.name);
            assert.equal(Object.hasOwn(response.data, "assignments"), false);
            recipients.add(response.data.recipient.name);
          }
          assert.equal(recipients.size, 4);
          const unauthorized = await call("reveal", {
            exchangeId: exchange.id, guestId: invitations[0].id, guestToken: "0".repeat(64)
          });
          assert.equal(unauthorized.status, 403);
          const second = await call("draw", { exchangeId: exchange.id, hostToken });
          assert.equal(second.status, 409);
          console.log("PASS: production create / private reveal / exclusion of self / unique recipients / invalid token / redraw lock");
          console.log("Cleanup record label: " + title);
          JS
