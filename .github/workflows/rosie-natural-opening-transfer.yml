name: RosieVerse approved audio remaster transfer
on:
  push:
    branches: [release/20261121-music-natural-openings]
    paths: [.github/workflows/rosie-natural-opening-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download original-intro MP3s from temporary RosieVerse audio studio
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib
          dst=pathlib.Path("public/rosie-music")
          existing=json.loads((dst/"catalog.json").read_text())
          source="https://sb-3ebzr4vtgemx.vercel.run"
          catalog=dst/"catalog-new.json"
          subprocess.run(["curl","-fLsS","--retry","3","--max-time","45",source+"/catalog.json","-o",str(catalog)],check=True)
          new=json.loads(catalog.read_text())
          assert new.get("natural_opening") is True
          assert len(new["tracks"])==len(existing["tracks"])==13
          originals={x["id"]:x["master_sha256"] for x in existing["tracks"]}
          expected={x["id"]:x for x in new["tracks"]}
          assert originals.keys()==expected.keys()
          for ident,entry in expected.items():
            assert ident.replace("-","").isalnum()
            assert entry["master_sha256"]==originals[ident]
            assert entry["opening_preserved"] is True
            assert entry["loop_start_seconds"]==(5 if entry["loop"] else 0)
            filename=entry["filename"]
            assert filename==ident+".mp3"
            target=dst/filename
            subprocess.run(["curl","-fLsS","--retry","3","--max-time","60",source+"/"+filename,"-o",str(target)],check=True)
            actual=hashlib.sha256(target.read_bytes()).hexdigest()
            assert actual==entry["sha256"],ident+" checksum failure"
            assert target.stat().st_size==entry["bytes"]
            assert 20000<entry["bytes"]<8000000
            print("VERIFIED",ident,entry["bytes"],"bytes",flush=True)
          catalog.rename(dst/"catalog.json")
          print("PASS: 13 original-intro MP3s and their source WAV hashes verified")
          PY
      - name: Commit verified audio binaries
        run: |
          set -euo pipefail
          git config user.name "RosieVerse Music Remaster"
          git config user.email "rosieverse-remaster@users.noreply.github.com"
          git add public/rosie-music/*.mp3 public/rosie-music/catalog.json
          git commit -m "Rebuild original RosieVerse soundtrack with natural note openings and seamless repeat anchors"
          git push origin HEAD:release/20261121-music-natural-openings
