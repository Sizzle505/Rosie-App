name: Focused Money and Gold Toolkit QA
on:
  push:
    branches: [work/gold-even-spacing-money-controls-20261012]
    paths: [.github/workflows/rosie-money-gold-focused-20261012.yml]
  # Retest native date input readability and formatted USD fields
  # Rerun controlled USD focus and replacement editing
jobs:
  verify-money-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify money formatting, USD list and bottom-of-toolkit return
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/rosie-money-vite.log 2>&1 &
          sleep 8
          node tests/calculations-toolkit-functional.mjs
