name: Import generated Rosie Recipes artwork
on:
  push:
    branches:
      - work/rosies-recipes-foundation-20261012
    paths:
      - .github/workflows/rosie-recipes-asset-import.yml
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Recipes branch
        uses: actions/checkout@v4
        with:
          ref: work/rosies-recipes-foundation-20261012
          persist-credentials: true
      - name: Transfer verified original image assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --output /tmp/rosie-recipes.zip 'https://uc0e47ad4fa4e2ba309b986164f1.dl.dropboxusercontent.com/cd/0/get/DJ5aQsxh5KygXUSm1Si3_allMV8ubsr-gOx58_t-kFOwU38-GJiF8Sw2Avs8P4yBmTueWmJFsdbtpeZUC3cIAXra1cr--4HtWycPlvWtQ4-sRX_HenhSlvhPCAnDKDXy3fJLXWqi3hp8eU-OAqxi546RBIauOe0RauNE8cEepUZQqg/file?c_luid=667ded1d'
          echo "e5f465e2b274e22db465ce6b9182f256ef407857ed94299582a593fb98467bb0  /tmp/rosie-recipes.zip" | sha256sum --check
          unzip -q -o /tmp/rosie-recipes.zip -d .
          for asset in recipes-hero.webp recipes-title.webp recipes-card-frame.webp recipes-parchment.webp recipes-controls.webp recipes-continuation.webp; do
            test -s "public/rosieverse/recipes/$asset"
          done
          file public/rosieverse/recipes/*.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/recipes/
          git rm .github/workflows/rosie-recipes-asset-import.yml
          git commit -m "Recipes: install all six verified original illustrated WebP assets"
          git push origin HEAD:work/rosies-recipes-foundation-20261012
