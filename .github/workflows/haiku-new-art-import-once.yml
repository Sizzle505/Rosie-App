        run: |
          python - <<'PY'
          from PIL import Image,ImageFilter
          import hashlib,io,json,os,urllib.request
          from pathlib import Path
          entries=json.loads(os.environ['HAIKU_LINKS'])
          root=Path('public/rosieverse/haiku/new')
          entries_written=[]
          for item in entries:
              req=urllib.request.Request(item['url'],headers={'User-Agent':'RosieHaikuApprovedArt/1.0'})
              with urllib.request.urlopen(req,timeout=180) as response:
                  raw=response.read()
              if len(raw)!=item['size']:
                  raise RuntimeError('Byte size mismatch '+item['name'])
              digest=hashlib.sha256(hashlib.sha256(raw).digest()).hexdigest()
              if digest!=item['content_hash']:
                  raise RuntimeError('Dropbox source checksum mismatch '+item['name'])
              im=Image.open(io.BytesIO(raw)).convert('RGBA')
              if item['name']=='sensei-bowing':
                  im=im.resize((534,576),Image.Resampling.LANCZOS)
                  im=im.filter(ImageFilter.UnsharpMask(radius=.8,percent=75,threshold=3))
              dest=root/item['output']
              dest.parent.mkdir(parents=True,exist_ok=True)
              im.save(dest,'WEBP',quality=88,method=5,exact=True)
              check=Image.open(dest)
              if check.size!=im.size or check.format!='WEBP':
                  raise RuntimeError('Invalid WebP '+item['name'])
              entries_written.append({
                  'name':item['name'],'production_path':item['output'],
                  'source_sha256':hashlib.sha256(raw).hexdigest(),
                  'production_sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),
                  'width':im.width,'height':im.height,'bytes':dest.stat().st_size
              })
              print('Verified and optimized:',item['name'],dest.stat().st_size)
          if len(entries_written)!=24:raise RuntimeError('Incomplete asset import')
          (root/'manifest.json').write_text(json.dumps({
              'title':'Rosie Haiku 2026-11-20 approved originals',
              'source':'Dropbox /Rosie-App-Transfer/Haiku-20261120-*.png',
              'count':len(entries_written),'assets':entries_written
          },indent=2)+'\n')
          print('ALL 24 ORIGINAL ASSETS VERIFIED')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test and build release
        run: |
          npm ci --no-audit --no-fund
          node --test tests/haikuGarden.test.mjs
          npm run build
      - name: Commit verified image masters and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/haiku/new
          git rm -- .github/workflows/haiku-new-art-import-once.yml
          git commit -m "Haiku: add 24 original approved production images and verified import manifest"
          git fetch origin feature/haiku-art-release-20261120
          git rebase origin/feature/haiku-art-release-20261120
          git push origin HEAD:feature/haiku-art-release-20261120
