name: Synchronize approved QR Atelier assets
on:
  push:
    branches: [work/resources-qr-recipes-integration-20261012]
    paths: [.github/workflows/qr-final-assets-sync.yml]
permissions:
  contents: write
jobs:
  sync-approved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/resources-qr-recipes-integration-20261012
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest approved QR art without importing held signature motif designs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/qr-atelier-foundation-20261012
          git merge --no-ff -X ours -m "Merge current QR Atelier approved illustrated asset development" origin/work/qr-atelier-foundation-20261012
          git checkout origin/work/qr-atelier-foundation-20261012 -- src/RosieQrAtelier.jsx src/RosieQrAtelier.css scripts/qrAtelierBrowserCheck.mjs
          git rm -f src/qrAtelierDesign.js
          git add src/RosieQrAtelier.jsx src/RosieQrAtelier.css scripts/qrAtelierBrowserCheck.mjs
          git commit -m "Use current illustrated QR controls and scanner-safe standard QR, hold unsigned decorative motifs"
          for asset in header-sign workbench-frame tile-ivory tile-emerald button-burgundy button-obsidian idle-paw collection-frame; do
            test -s "public/qr-atelier/$asset.webp"
          done
          test -s public/rosieverse/recipes/recipes-hero.webp
          test -s src/rosieRecipesData.js
          test -s src/RosieRecipes.jsx
          git rm .github/workflows/qr-final-assets-sync.yml
          git commit -m "Remove completed QR asset integration workflow"
          git push origin HEAD:work/resources-qr-recipes-integration-20261012
