name: Layout Studio - Fullscreen interaction QA
on:
  push:
    branches:
      - feature/layout-playground-immersive-20261116
    paths:
      - src/LayoutPlayground.jsx
      - src/LayoutPlayground.css
      - src/main.jsx
      - scripts/verify_layout_playground_immersive.mjs
      - .github/workflows/layout-playground-immersive.yml
  pull_request:
    branches: [main]
    paths:
      - src/LayoutPlayground.jsx
      - src/LayoutPlayground.css
      - src/main.jsx
      - scripts/verify_layout_playground_immersive.mjs
      - .github/workflows/layout-playground-immersive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify Vite build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Simulate real fullscreen resizing, editing, and page interaction
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/layout-studio.log 2>&1 &
          sleep 5
          node scripts/verify_layout_playground_immersive.mjs
      - name: Preserve screenshot captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-playground-fullscreen-qa
          path: artifacts/layout-playground/
          if-no-files-found: ignore
