name: Install continuous terrain textures (one-time)
on:
  push:
    branches:
      - "work/ember-drill-barkroot-ruby-milestone"
    paths:
      - ".github/workflows/ember-terrain-import.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "work/ember-drill-barkroot-ruby-milestone"
          persist-credentials: true
      - name: Recover and validate seamless terrain textures
        env:
          TERRAIN_ZIP_URL: 'https://ucdd74b4ee311f6a4600904f3da5.dl.dropboxusercontent.com/cd/0/get/DJ-NL9C1OSbXTNfgC3TczrzMk3mKtWgJdyJ50QjTsMJNcPX3gdqVbuU81rRKvhlKSkSCU0C-VAmjVNQ6yv6isYy14Tp2uZQD3eBopFOYi7rRBQqV5o3z5rSwJD5itr_ahjxA2yuRzhJaRUiRZfVszh4mOlbMZ1idaSpQsykDteIpig/file?c_luid=667ded1d'
        shell: bash
        run: |
          python - <<'PY'
          import io,os,zipfile,urllib.request
          from pathlib import Path
          req=urllib.request.Request(os.environ["TERRAIN_ZIP_URL"],headers={"User-Agent":"RosieApp-AssetImporter"})
          with urllib.request.urlopen(req,timeout=80) as response:raw=response.read()
          target=Path("public/ember-drill");target.mkdir(exist_ok=True,parents=True)
          names=("barkroot-earth","deep-rootstone","ruby-crystal-rock","temple-basalt")
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in names:
                  data=z.read(name+".webp")
                  assert data[0:4]==b"RIFF" and len(data)<140000
                  (target/("terrain-"+name+".webp")).write_bytes(data)
                  print(name,len(data))
          PY
      - name: Commit tested materials
        run: |
          git config user.name "rosie-art-importer[bot]"
          git config user.email "rosie-art-importer@users.noreply.github.com"
          git add public/ember-drill/terrain-*.webp
          git diff --cached --quiet || git commit -m "Import seamless continuous cave materials from Dropbox"
          git push origin HEAD:work/ember-drill-barkroot-ruby-milestone
