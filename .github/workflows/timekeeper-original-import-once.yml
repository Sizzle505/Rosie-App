name: Timekeeper generated image asset import
on:
  push:
    branches: [work/timekeeper-millisecond-rebuild-20261012]
    paths: [.github/workflows/timekeeper-original-import-once.yml]
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Preserve original transparent image assets, trim and optimize
        env:
          SQUIRREL_ORIGINAL: "https://uc0edba260d79588f24c704cc3f2.dl.dropboxusercontent.com/cd/0/get/DJ5f1bVtFZTQumGnNxV9iRMkeXnp8hgDCDwtddfMkD9pKkQNPgmBQVg4pQa0Jlz7iOor_eCDkAFPwo3rX5lh9VKpYfNXzuoNFxISovKAfy4EKVsNhflpvTJ59ffuGT_Spk7jd_NgomfZ72aBAqQXGBCAxUMRe2LE_ncZXeKV-8ZUwg/file?c_luid=667ded1d"
          RING_ORIGINAL: "https://ucada010824cfbe6907f198ca91c.dl.dropboxusercontent.com/cd/0/get/DJ6hbM88dtvErxGoUcQfhpkAxpvrpOvzEr5f9eIWcGmBoCgXxvnrj1_XR3T_ZNO9bvQsjdDhFn6rNjoNXRolYQUPZSLuY9ccKLCsOqMuucO6SCESiOH_DtVhSzRRBSi_FJT0Qx-W7FTXil36FeB7bVGsDPTAKSRsT2wAKxUlHmhhSw/file?c_luid=667ded1d"
        run: |
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import os, urllib.request
          root="public/rosieverse/timekeeper"
          os.makedirs(root, exist_ok=True)
          for token,out in [("SQUIRREL_ORIGINAL","running-squirrel.webp"),("RING_ORIGINAL","ornate-energy-track.webp")]:
              req=urllib.request.Request(os.environ[token],headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=100) as f: raw=f.read()
              source=Image.open(BytesIO(raw)).convert("RGBA")
              assert source.size[0]>1000 and source.getchannel("A").getextrema()==(0,255)
              if token=="SQUIRREL_ORIGINAL":
                  a=source.getchannel("A")
                  bounds=a.point(lambda v:255 if v>18 else 0).getbbox()
                  pad=15
                  source=source.crop((max(0,bounds[0]-pad),max(0,bounds[1]-pad),
                                      min(source.width,bounds[2]+pad),min(source.height,bounds[3]+pad)))
                  source.thumbnail((420,420),Image.Resampling.LANCZOS)
              else:
                  source.thumbnail((900,900),Image.Resampling.LANCZOS)
              target=os.path.join(root,out)
              source.save(target,"WEBP",quality=90,method=6)
              print(out,source.size,os.stat(target).st_size)
          PY
      - name: Commit actual original generated raster assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/timekeeper/running-squirrel.webp public/rosieverse/timekeeper/ornate-energy-track.webp
          git diff --cached --quiet && exit 0
          git commit -m "Import generated Timekeeper squirrel and ornate energy track from Dropbox"
          git push
