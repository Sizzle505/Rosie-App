name: Focused gold tool functional QA
on:
  push:
    branches:
      - work/calculations-satin-fullscreen-safe-tray-20261012
    paths:
      - .github/workflows/rosie-gold-functional-once-20261012.yml
jobs:
  gold-tool-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check all seven tools inside centered satin viewport
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rosie-satin-dev.log 2>&1 &
          sleep 7
          node tests/calculations-toolkit-functional.mjs
