name: QR Atelier layered assets import
on:
  push:
    branches:
      - work/qr-atelier-foundation-20261012
    paths:
      - .github/workflows/qr-atelier-layered-assets-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved originals from Dropbox
        shell: bash
        env:
          URL_HEADER_SIGN: "https://uc234afc091e86677431f3038452.dl.dropboxusercontent.com/cd/0/get/DJ5er5AEs0-yz9yiP1jhNqujuuaASS9QVaYB66_RhwGDjhQQeh0TUJtemm7FKwnbRatej5b6gRVERb4gNKj_3S5s3-LAdJfiVT407Cs9Ft_kz9dK1bvP0rLHByE4eSex09sTa2N-p4A6o_8LjSnJA30Lkh9XLeoj7zlpwGsQ2neddQ/file?c_luid=667ded1d"
          URL_WORKBENCH_FRAME: "https://ucf6eb5a6af45bcd4a0f1c7e001d.dl.dropboxusercontent.com/cd/0/get/DJ5iBKTpW4K95sHxQkHni_IDjnrerJhJh7HAp1JDEJ4t1Qb1jCUeKKEgepCeJaZP7a6A11v9vA3y4YoGta4oD1b_OBEKGiV7PsdCAKR5xqEG1rsfNJSiinhCyymQZ258OztHdIXamFRVSewi1xtuMuPEmXaxyeLH0NAWs8_Y_oBjaQ/file?c_luid=667ded1d"
          URL_TILE_IVORY: "https://ucca329e79c96ddcc56aaf8283e0.dl.dropboxusercontent.com/cd/0/get/DJ6tO4pjXuMXB2cm8gfQisiwnsDJtLPSGkaedZtEtg2Wj5SsKDfa13nKoehPuzI2rp5clZTI_T5qjohrULoeUeGyohbyeEokvesuZNm60zBm5KLUv7zHNLAj75M5RFUrf2aLg5wuoJrWG2oX7s21xSbGDq_9j1lQPA1mjR-_8NJxbw/file?c_luid=667ded1d"
          URL_TILE_EMERALD: "https://ucf66cc705fc2bfa1cd48caac483.dl.dropboxusercontent.com/cd/0/get/DJ6ie1l8_b02hPNUNDzu3j6WDVQhR6YCZt8Ptsi1WraZDeU00V8w3LjAeqLQT8JX7dTxVrPVFIpuvOK_kB9swK1-7PUuVNOZO9mLMwgTeDJ3SjT7bRPpWNo3SDzWgloa10MR0BuZb7vxXxTH07Vasi2UD_Z9mkjj1xFkcIw7ni7KzQ/file?c_luid=667ded1d"
          URL_BUTTON_BURGUNDY: "https://uccef5ae8aff77300535a14d16e8.dl.dropboxusercontent.com/cd/0/get/DJ5tmlTyxnPIilseeuC8ZGYlEdDaAzaCSaXxyBfsxZ3-YE2cgEzoAKFRm8LTpgh1SuxxM8prgK4Y_J3u8Wi294yJoVTOqHAHde5UZpnxphIPqIF_XtDp4xp_09lSbZvs-mN94Yrr-HMKFGVqBFk_Lk5Mrc55ShgzokmManb7Ndk0NA/file?c_luid=667ded1d"
          URL_BUTTON_OBSIDIAN: "https://uc6165258626981b7b2770836d99.dl.dropboxusercontent.com/cd/0/get/DJ4RCLzmYuRyzbEoQBO5qEhgu4s09X5HX4DFS-v6OPua_Ce6zQ8B_OcoYC32DiF92IkgNF_7oNRySrS-Ggv5_6UrUaNDjZSl_aknrrnTD-NyVoNSQ85P-PAlCt23mhZ4FsqgglYkkiWRYudE3LFs4RLyeUu0T7zCq7X996Doz2NktQ/file?c_luid=667ded1d"
          URL_IDLE_PAW: "https://ucc50535d9ac0e7148dde9a1de58.dl.dropboxusercontent.com/cd/0/get/DJ5Qcny-H4ty_iuTDl3f3G7BdklshatyKj6AVmrB8ZtUarmmx4BX1yZUiWsQM0hoXbvg_GYb3kcYv8SnC0aqn7uAbVT7YWK3VxzyQhO1aDe3cBdX3havc1PjB2nvit3zvlfzJ2FTfLP6mXyIvG6faLIAMlGGan1f0JsW_iBak7cfKg/file?c_luid=667ded1d"
          URL_COLLECTION_FRAME: "https://ucb7a7594c42e0a1281f19941a3a.dl.dropboxusercontent.com/cd/0/get/DJ5Vm0Y0aqU-RqtRMgoEBoQBQyGCvRS9qzTQlLbUc1tVHCCK0mDjecPl2U9wponopmlAxfQ6tPQPojwnK50OZh1-s3XgnF7kaxebO5wUA4R2IS9KFsNuXAQXKVQ897s2v9zztD9Y9L512WFIcIBBcLXjF8By8-zoWat2UZMihUiw2g/file?c_luid=667ded1d"
        run: |
          set -euo pipefail
          mkdir -p /tmp/qr-atelier-approved
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/header-sign.png" "$URL_HEADER_SIGN"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/workbench-frame.png" "$URL_WORKBENCH_FRAME"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/tile-ivory.png" "$URL_TILE_IVORY"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/tile-emerald.png" "$URL_TILE_EMERALD"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/button-burgundy.png" "$URL_BUTTON_BURGUNDY"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/button-obsidian.png" "$URL_BUTTON_OBSIDIAN"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/idle-paw.png" "$URL_IDLE_PAW"
          curl -fsSL --retry 2 --max-time 110 -o "/tmp/qr-atelier-approved/collection-frame.png" "$URL_COLLECTION_FRAME"
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("/tmp/qr-atelier-approved")
          dest=Path("public/qr-atelier")
          dest.mkdir(parents=True,exist_ok=True)
          dimensions={"header-sign":1200,"workbench-frame":1024,"tile-ivory":360,"tile-emerald":360,"button-burgundy":1250,"button-obsidian":1250,"idle-paw":360,"collection-frame":1200}
          for key,max_width in dimensions.items():
              img=Image.open(base/(key+".png")).convert("RGBA")
              alpha=img.getchannel("A")
              extent=alpha.point(lambda a:255 if a>=16 else 0).getbbox()
              if extent is None: raise ValueError("Asset has no visible pixels: "+key)
              pad=8
              extent=(max(0,extent[0]-pad),max(0,extent[1]-pad),min(img.width,extent[2]+pad),min(img.height,extent[3]+pad))
              img=img.crop(extent)
              if img.width > max_width:
                  ratio=max_width/img.width
                  img=img.resize((max_width,max(1,round(img.height*ratio))),Image.Resampling.LANCZOS)
              img.save(dest/(key+".webp"),"WEBP",quality=90,method=6,exact=True)
              print(key,img.size,(dest/(key+".webp")).stat().st_size)
          PY
      - name: Commit optimized individual WebP files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/qr-atelier/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(qr): import transparent Atelier layers from Dropbox"
            git fetch origin "work/qr-atelier-foundation-20261012"
            git rebase "origin/work/qr-atelier-foundation-20261012"
            git push origin "HEAD:work/qr-atelier-foundation-20261012"
          fi
