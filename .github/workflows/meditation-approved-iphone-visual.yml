name: Approved iPhone meditation scenes
on:
  pull_request:
    paths:
      - "src/RosieZenMeditation.jsx"
      - "src/RosieZenApprovedPhone.css"
      - "src/RosieHaikuGarden.jsx"
      - "public/rosieverse/haiku/new/meditation/iphone/approved/**"
      - "tests/meditation-approved-iphone.mjs"
      - ".github/workflows/meditation-approved-iphone-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start RosieVerse preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/rosie-iphone-art.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rosie-iphone-art.log
          exit 1
      - name: Validate all five original iPhone scenes on real mobile viewports
        run: node tests/meditation-approved-iphone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meditation-approved-iphone-screenshots
          path: artifacts/meditation-iphone/
          retention-days: 14
