name: Rosie mobile visual regression
on:
  pull_request:
    paths:
      - 'src/main.jsx'
      - 'src/RosieRandomizers.module.css'
      - 'src/visual-rebuild.css'
      - 'src/barkbridge-reference.css'
      - 'public/barkbridge-photo-reference-engraving.svg'
      - 'public/barkbridge-ornamental-border.svg'
      - 'tests/rosie-mobile-visual.mjs'
      - '.github/workflows/rosie-mobile-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start and await Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rosie-vite.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rosie-vite.log
          exit 1
      - run: node tests/rosie-mobile-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosie-mobile-webkit-chromium-screenshots
          path: artifacts/rosie-visual/
          retention-days: 14
