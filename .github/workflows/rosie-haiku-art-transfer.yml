name: Rosie Haiku Art Transfer (one-time)
on:
  push:
    branches:
      - feature/rosie-haiku-garden
    paths:
      - ".github/workflows/rosie-haiku-art-transfer.yml"
jobs:
  import-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
