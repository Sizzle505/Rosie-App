          HAIKU_TRANSFER_SHA256: '{"RosieHaikuCharacters01-10.zip":"56ed3754e4dadf58288cf60a95ff1e248527dd4e992eed2345c2434757473c03","grand_sakura_poetry_scroll.png":"334200cc1661c8cd9aaae54e9fe3c91bf6f70ee947dae65a8cb9cb146e6a75c2","ornate_sakura_poetry_scroll.png":"fbceaa366de81360250dfdc796c02a64fef5fde2f8c6b7001f0b9d5549074688","imperial_sakura_calligraphy_desk.png":"270e8cfd353c80d22fab7cd732496b55de703efbf46306047bc13c8b786bcc3e","rosie_s_ornate_sakura_inkstone_set.png":"d6f93d840c986a2a809e6d10feaad6f8bb797e18786efa3293dbfa638cdeb6be","ornate_sakura_calligraphy_brushstroke_sprite_sheet.png":"5756b32b61af7edda08228e3f8375312e80e2bcdf7448ad260aba5e6dbcb547c","luminous_sakura_canopy_overlay.png":"ff69d4ec7cbdf535577f6db280f3a0ed9fb83222eafb15da1c625230dac8f0f4","dreamy_rosy_gold_garden_atmosphere.png":"ae331943e40c00f3b4ea30ceef5d67ef54c01c5b506372921145be655f126efa","rosieverse_sakura_garden_ui_sheet.png":"4bf933d6210af77ad0cd7c17d7d8f1db7e529ef6b79ca50130d658ca638d3538","rosie_s_sakura_paw_lantern.png":"e0dfda4557f4ecdf5fe85afe6c03d63a921b8fa68d4b14d6c646831df92b0036","enlightenment_sakura_bloom_transition.png":"a0bc587aa0e37f37cdd835c9ab584ee252171214a883369890c91472134d0460"}'
          HAIKU_UI_OUTPUTS: '{"grand_sakura_poetry_scroll.png":"scroll-grand.webp","ornate_sakura_poetry_scroll.png":"scroll-mobile.webp","imperial_sakura_calligraphy_desk.png":"calligraphy-desk.webp","rosie_s_ornate_sakura_inkstone_set.png":"inkstone-set.webp","ornate_sakura_calligraphy_brushstroke_sprite_sheet.png":"brushstroke-sprites.webp","luminous_sakura_canopy_overlay.png":"sakura-canopy.webp","dreamy_rosy_gold_garden_atmosphere.png":"garden-atmosphere.webp","rosieverse_sakura_garden_ui_sheet.png":"garden-ui-sheet.webp","rosie_s_sakura_paw_lantern.png":"lantern.webp","enlightenment_sakura_bloom_transition.png":"enlightenment-transition.webp"}'
          HAIKU_CHARACTER_OUTPUTS: '{"01 - Contemplative Rosie.png":"rosie-contemplative.webp","02 - Calligrapher Rosie.png":"rosie-calligrapher.webp","03 - Smug Rosie.png":"rosie-smug.webp","04 - Affectionate Rosie.png":"rosie-affectionate.webp","05 - Existential Rosie.png":"rosie-existential.webp","06 - Indignant Rosie.png":"rosie-indignant.webp","07 - Inspired Rosie.png":"rosie-inspired.webp","08 - Triumphant Rosie.png":"rosie-triumphant.webp","09 - Meditating Rosie - Animation.png":"rosie-meditating-animation.webp","09 - Meditation Animation Frames.png":"rosie-meditation-frames.webp","10 - Bestowing Wisdom Rosie.png":"rosie-bestowing-wisdom.webp"}'
        run: |
          python - <<'PY'
          import os, io, zipfile, hashlib, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          import json
          urlmap=json.loads(os.environ["HAIKU_TRANSFER_JSON"])
          digests=json.loads(os.environ["HAIKU_TRANSFER_SHA256"])
          ui=json.loads(os.environ["HAIKU_UI_OUTPUTS"])
          characters=json.loads(os.environ["HAIKU_CHARACTER_OUTPUTS"])
          out=Path("public/rosieverse/haiku")
          out.mkdir(parents=True,exist_ok=True)
          data={}
          for name,url in urlmap.items():
              # Dropbox links are single-use. Exactly one GET and no HEAD/preflight.
              with urllib.request.urlopen(url,timeout=120) as response:
                  data[name]=response.read()
              digest=hashlib.sha256(data[name]).hexdigest()
              if digest!=digests[name]:
                  raise ValueError(f"Integrity mismatch for {name}: {digest}")
              print(f"Verified {name}: {len(data[name])} bytes")
          def write_webp(name,original):
              with Image.open(io.BytesIO(original)) as source:
                  source.load()
                  im=source.convert("RGBA")
                  max_dimension=1800 if "frames" in name else 1300
                  if max(im.size)>max_dimension:
                      ratio=max_dimension/max(im.size)
                      im=im.resize((round(im.width*ratio),round(im.height*ratio)),Image.Resampling.LANCZOS)
                  target=out/name
                  im.save(target,"WEBP",quality=88,method=6,exact=True)
                  if target.stat().st_size<5000:raise ValueError(f"Suspiciously tiny {target}")
                  print(f"Wrote {target}: {im.size}, {target.stat().st_size} bytes")
          for original,dest in ui.items():write_webp(dest,data[original])
          with zipfile.ZipFile(io.BytesIO(data["RosieHaikuCharacters01-10.zip"])) as z:
              for original,dest in characters.items():
                  content=z.read(original)
                  write_webp(dest,content)
              # Keep a real, animated breathing loop; optimized for web.
              with Image.open(io.BytesIO(z.read("09 - Meditation Breathing Loop.gif"))) as im:
                  frames=[]
                  durations=[]
                  for i in range(im.n_frames):
                      im.seek(i)
                      frame=im.convert("RGBA")
                      if frame.width>530:
                          r=530/frame.width
                          frame=frame.resize((530,round(frame.height*r)),Image.Resampling.LANCZOS)
                      frames.append(frame.copy())
                      durations.append(max(70,int(im.info.get("duration",120))))
                  if frames:
                      frames[0].save(out/"rosie-meditation-breathing.webp",save_all=True,append_images=frames[1:],duration=durations,loop=0,quality=79,method=5)
                      print("Wrote animated breathing loop:",len(frames),"frames")
          
          PY
      - name: Commit optimized art to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rosieverse/haiku/
          git diff --cached --quiet && exit 0
          git commit -m "Import and optimize Haiku Garden character and interface artwork"
          git push origin HEAD:feature/rosie-haiku-garden
