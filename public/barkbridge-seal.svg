<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">University of Barkbridge academic seal</title>
  <desc id="desc">Antique gold circular university seal with a Shiba profile at center.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d99c"/>
      <stop offset=".42" stop-color="#b47b31"/>
      <stop offset=".72" stop-color="#efd28b"/>
      <stop offset="1" stop-color="#8b5724"/>
    </linearGradient>
    <radialGradient id="paper" cx=".35" cy=".25" r=".9">
